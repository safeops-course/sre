default_install_hook_types:
  - pre-commit
  - pre-push
  - pre-merge-commit
  - prepare-commit-msg

repos:
  - repo: local
    hooks:
      - id: master-branch-check
        name: Protected branch guard
        entry: scripts/pre-commit-master-check.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [pre-commit, pre-push, pre-merge-commit]
        args:
          - --protected=master
          - --protected=main

      - id: prevent-amend-after-push
        name: Prevent amending pushed commits
        entry: scripts/prevent-amend-after-push.sh
        language: script
        always_run: true
        pass_filenames: false
        stages: [prepare-commit-msg]

  - repo: local
    hooks:
      - id: guard-kube-context-test
        name: guard-kube-context tests (fake kubectl, no cluster)
        entry: tests/guard-kube-context.test.sh
        language: script
        files: ^(scripts/guard-kube-context\.sh|tests/guard-kube-context\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: merge-kubeconfig-test
        name: merge-kubeconfig tests (throw-away HOME, no cluster)
        entry: tests/merge-kubeconfig.test.sh
        language: script
        files: ^(infra/terraform/kind_cluster/scripts/merge-kubeconfig\.sh|tests/merge-kubeconfig\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: kube-context-hook-test
        name: agent kube-context hook tests (text only, no cluster)
        entry: tests/kube-context-hook.test.sh
        language: script
        files: ^(scripts/agent-hooks/kube-context-hook\.sh|tests/kube-context-hook\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: prevent-amend-after-push-test
        name: amend guard tests (throw-away repository, no GitHub)
        entry: tests/prevent-amend-after-push.test.sh
        language: script
        files: ^(scripts/prevent-amend-after-push\.sh|tests/prevent-amend-after-push\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-sops-encrypted-test
        name: sops-encrypted check tests (throw-away repository, no sops)
        entry: tests/check-sops-encrypted.test.sh
        language: script
        files: ^(scripts/check-sops-encrypted\.sh|tests/check-sops-encrypted\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-image-tags-test
        name: image-tag check tests (throw-away copy of flux/apps)
        entry: tests/check-image-tags.test.sh
        language: script
        files: ^(scripts/check-image-tags\.sh|tests/check-image-tags\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: postgres-restore-manifest-test
        name: restore manifest tests (stub kubectl, no cluster)
        entry: tests/postgres-restore-manifest.test.sh
        language: script
        files: ^(scripts/postgres-restore-manifest\.sh|tests/postgres-restore-manifest\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: check-policy-exceptions-test
        name: policy-exception check tests (throw-away copy, no cluster)
        entry: tests/check-policy-exceptions.test.sh
        language: script
        files: ^(scripts/check-policy-exceptions\.sh|tests/check-policy-exceptions\.test\.sh|tests/kyverno/exceptions\.yaml)$
        pass_filenames: false
        stages: [pre-commit]

      - id: kyverno-policies-test
        name: Admission guardrails give the expected verdicts (kyverno test, no cluster)
        entry: tests/kyverno-policies.test.sh
        language: script
        files: ^(flux/infrastructure/policy/packs/admission-guardrails/.*|tests/kyverno/.*|tests/kyverno-policies\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: kyverno-supply-chain-test
        name: Supply-chain policies give the expected verdicts on real images (kyverno test, network)
        entry: tests/kyverno-supply-chain.test.sh
        language: script
        files: ^(flux/infrastructure/policy/packs/supply-chain/.*|tests/kyverno-supply-chain/.*|tests/kyverno-supply-chain\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: tool-versions-test
        name: The tests run the Kyverno and Prometheus versions the cluster runs (helm show)
        entry: tests/tool-versions.test.sh
        language: script
        files: ^(flux/infrastructure/policy/kyverno/release\.yaml|flux/infrastructure/observability/kube-prometheus-stack/base/release\.yaml|\.github/workflows/pre-commit\.yml|tests/tool-versions\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: platform-alerts-test
        name: Platform alerts fire where they should, and only there (promtool test rules, no cluster)
        entry: tests/platform-alerts.test.sh
        language: script
        files: ^(flux/infrastructure/observability/kube-prometheus-stack/monitoring/platform-alerts\.yaml|flux/infrastructure/progressive-delivery/develop/alerts\.yaml|tests/platform-alerts/.*|tests/platform-alerts\.test\.sh)$
        pass_filenames: false
        stages: [pre-commit]

      - id: flux-kustomize-validate
        name: Flux kustomize validate
        entry: scripts/flux-kustomize-validate.sh
        language: script
        files: ^flux/.*\.ya?ml$
        pass_filenames: true
        require_serial: true
        stages: [pre-commit]

      - id: app-security
        name: App manifests keep the security rules (no SA token, no pprof, no chaos in production)
        entry: scripts/check-app-security.sh
        language: script
        files: ^flux/apps/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]

      - id: oidc-rbac
        name: OIDC RBAC binds only Dex org:team groups; write roles only in develop
        entry: scripts/check-oidc-rbac.sh
        language: script
        files: ^flux/infrastructure/security/(rbac|dex)/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]

      - id: policy-exceptions
        name: PolicyExceptions are narrow, owned and not expired
        entry: scripts/check-policy-exceptions.sh
        language: script
        files: ^flux/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]

      - id: image-tags
        name: Each overlay's image tag matches its own ImagePolicy, with the setter comment
        entry: scripts/check-image-tags.sh
        language: script
        files: ^flux/apps/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]

      - id: app-resources
        name: App resources (staging = production >= develop) fit the namespace quotas
        entry: scripts/check-app-resources.sh
        language: script
        files: ^flux/(apps|infrastructure/resource-management|infrastructure/data/cnpg-clusters)/.*\.ya?ml$
        pass_filenames: false
        stages: [pre-commit]

      - id: terraform-fmt
        name: Terraform format check
        entry: terraform fmt -recursive -diff -check
        language: system
        files: \.tf$
        pass_filenames: false
        stages: [pre-commit]

      - id: terraform-validate
        name: Terraform validate
        entry: scripts/terraform-validate.sh
        language: script
        files: \.(tf|tfvars)$
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: terraform-security
        name: Terraform security scan
        entry: scripts/terraform-security.sh
        language: script
        files: \.(tf|tfvars)$
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: no-secrets
        name: Block sensitive files
        entry: scripts/block-secrets.sh
        language: script
        # The file NAME, not the whole path: scripts/merge-kubeconfig.sh is not a kubeconfig.
        # Terraform state and saved plans hold every secret in plain text (Chapter 02):
        # *.tfstate, its backups (*.tfstate.*), tfplan, tfplan.meta, *.tfplan.
        # The age private key decrypts every SOPS secret: *.agekey and its backups (*.agekey.*).
        files: (^|/)(kubeconfig(\.ya?ml)?|[^/]+\.(key|pem)|[^/]*\.agekey(\.[^/]+)?|credentials[^/]*|[^/]*\.env(\.[^/]+)?|[^/]*\.tfstate(\.[^/]+)?|tfplan(\.meta)?|[^/]*\.tfplan)$
        exclude: \.example$
        stages: [pre-commit]

      - id: sops-encrypted
        name: Secrets under flux/secrets/ are SOPS-encrypted
        entry: scripts/check-sops-encrypted.sh
        language: script
        files: ^flux/secrets/.*\.ya?ml$
        stages: [pre-commit]

  # Secrets by CONTENT in the staged changes (rules: .gitleaks.toml). The hooks above see file names
  # and SOPS structure only.
  # pre-commit builds the hook with Go on first use - it installs its own Go if none is present.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1 # = GITLEAKS_VERSION in .github/workflows/secrets-guard.yml (the job checks it)
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        files: \.sh$
        args: [--severity=warning]
        stages: [pre-commit]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        files: \.ya?ml$
        args: [-d, relaxed]
        stages: [pre-commit]
