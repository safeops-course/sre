# Credential registry - every credential the platform runs on: what it grants, every place a copy
# lives, what uses it, when it was last replaced and how. Names and dates only - never a value.
# The runbooks are in docs/credential-rotation.md; the rules are checked by scripts/check-credentials.sh
# (pre-commit when this file changes, and every day on main - .github/workflows/credential-rotation.yml).
#
# class    token    API tokens, PATs, OAuth client secrets, webhook URLs  - replaced every 90 days
#          key      private keys, passphrases, signing secrets, passwords - replaced every 180 days
#          cluster  created with a cluster and gone with it (Hetzner is rebuilt each cycle) - no date;
#                   its runbook says how to replace it on a cluster that lives on
# rotated  the day the value was last REPLACED at its source (re-encrypting the same value is not one)
# expires  optional: the date the provider itself ends it (a fine-grained PAT) - checked too
# exposed  optional: the day the value was seen by someone who should not have it. Its age no longer
#          matters - it is due at once, unless rotated after that day
# accepted optional, only with exposed or an overdue date: {since, until, reason} - debt taken on purpose
#          on `since`, for at most 30 days after it, then it fails again. A longer debt is a new
#          decision: a new since, in a pull request
#
# The local kind cluster's credentials (age.agekey, its Terraform state) are throw-away and not here.
# Google Cloud has none to rotate: CI signs in through Workload Identity Federation (short-lived tokens,
# no key - gcp_foundation creates no service account key), the GKE kubeconfig holds no credential
# (gke-gcloud-auth-plugin), and the owner's gcloud login lives in ~/sre/.local/gcloud, outside the platform.
# AWS has none either: CI assumes the deployer role through GitHub OIDC (aws_foundation creates no access
# key), and a person signs in with `aws login` (short-lived credentials, at most 12 hours).
# "The cloud cluster" below is whichever provider's cluster runs (docs/providers.md lists them): they never
# run at the same time and every provider's Terraform gives it the same Secrets - so a new provider changes
# nothing here, unless it brings a credential of its own.
credentials:
  - name: sops-age-platform
    what: decrypts every Secret under flux/secrets/ except local/ - every copy encrypted for it, in every commit until the key is replaced
    class: key
    lives_in:
      - GitHub organization secret SOPS_AGE_KEY (sre only)
      - the owner's password vault
      - the cloud cluster, Secret flux-system/sops-age (Terraform, write-only)
    used_by: Flux kustomize-controller; every cloud cluster's Terraform module
    rotated: 2026-09-26
    runbook: flux/secrets/README.md#key-rotation

  - name: hcloud-token
    what: read and write on the SafeOps Hetzner project - create and delete servers, networks, volumes
    class: token
    lives_in:
      - GitHub organization secret HCLOUD_TOKEN
      - the owner's hcloud context (workstation)
      - the Hetzner cluster, Secrets kube-system/hcloud and kube-system/hcloud-csi (kube-hetzner)
    used_by: Terraform hcloud_cluster (CI and workstation); Hetzner cloud controller manager and CSI driver
    rotated: 2026-10-11
    runbook: docs/credential-rotation.md#hetzner-api-token

  - name: hcloud-node-ssh-key
    what: root SSH on every Hetzner node
    class: key
    lives_in:
      - GitHub organization secret HCLOUD_SSH_PRIVATE_KEY (public half - variable HCLOUD_SSH_PUBLIC_KEY)
      - the owner's ~/.ssh
    used_by: Terraform hcloud_cluster (kube-hetzner provisions the nodes over SSH); scripts/node-maintenance.sh
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#node-ssh-key

  - name: r2-terraform-state
    what: read and write on the R2 bucket that holds the Terraform state - every secret the state holds
    class: token
    lives_in:
      - GitHub organization secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
      - the owner's .env.local (workstation)
    used_by: Terraform S3 backend (every cloud module, and a provider's foundation such as gcp_foundation)
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#r2-and-backup-keys

  - name: backup-s3
    what: read and write on the database backup bucket
    class: token
    lives_in:
      - GitHub organization secrets BACKUP_S3_ACCESS_KEY_ID, BACKUP_S3_SECRET_ACCESS_KEY
      - the cloud cluster, Secret cnpg-backup-s3 in develop, staging, production (Terraform)
    used_by: CloudNativePG backups (barman)
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#r2-and-backup-keys

  - name: tfplan-passphrase
    what: decrypts the saved Terraform plan uploaded as a CI artifact - the plan holds every variable
    class: key
    lives_in:
      - GitHub organization secret TFPLAN_PASSPHRASE
    used_by: terraform-hcloud workflow (encrypts the plan, decrypts it in the apply job)
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#tfplan-passphrase

  - name: course-repo-pat
    what: writes pull requests to the course repository (safeops-course/sre-course)
    class: token
    lives_in:
      - GitHub organization secret COURSE_REPO_PAT
    used_by: sync-course-snippets workflow
    rotated: 2026-10-11
    expires: 2027-01-09
    runbook: docs/credential-rotation.md#course-repo-pat

  - name: image-automation-deploy-key
    what: pushes to safeops-course/sre (a read-write deploy key) - image tag updates on main
    class: key
    lives_in:
      - flux/secrets/flux-system/image-automation-deploy-key.yaml
      - safeops-course/sre deploy keys (public half)
    used_by: Flux source-controller and image-automation-controller (the cloud cluster)
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#image-automation-deploy-key

  - name: dex-github-oauth
    what: Dex signs people in with GitHub and reads their team membership (OAuth App of the organization)
    class: token
    lives_in:
      - flux/secrets/auth/dex-secrets.yaml (DEX_GITHUB_CLIENT_ID, DEX_GITHUB_CLIENT_SECRET)
      - the OAuth App "SafeOps Dex" in the safeops-course organization
    used_by: Dex (the cloud cluster)
    rotated: 2026-09-27
    runbook: docs/credential-rotation.md#dex-github-oauth-app

  - name: dex-headlamp-client
    what: the Headlamp client of Dex - Headlamp signs people in with it
    class: token
    lives_in:
      - flux/secrets/auth/dex-secrets.yaml (DEX_HEADLAMP_CLIENT_SECRET)
    used_by: Dex and Headlamp (the cloud cluster)
    rotated: 2026-09-27
    runbook: docs/credential-rotation.md#generated-secrets

  - name: cloudflare-dns-token
    what: edits the DNS records of the zone
    class: token
    lives_in:
      - flux/secrets/cloudflare/external-dns-cloudflare-api-token.yaml
    used_by: external-dns (the cloud cluster)
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#cloudflare-tokens

  - name: cloudflare-origin-ca-token
    what: issues Cloudflare Origin CA certificates for the zone
    class: token
    lives_in:
      - flux/secrets/cloudflare/cloudflare-origin-ca-token.yaml
    used_by: cert-manager origin-ca-issuer (the cloud cluster)
    rotated: 2026-09-27
    runbook: docs/credential-rotation.md#cloudflare-tokens

  - name: backend-jwt-secret
    what: signs the backend's login tokens - whoever holds it can sign in as any user
    class: key
    lives_in:
      - flux/secrets/develop/backend-secrets.yaml (jwt-secret)
      - flux/secrets/staging/backend-secrets.yaml (jwt-secret)
      - flux/secrets/production/backend-secrets.yaml (jwt-secret)
    used_by: backend in develop, staging, production
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#generated-secrets

  - name: postgres-app-develop-staging
    what: the app role of the develop and staging databases
    class: key
    lives_in:
      - flux/secrets/develop/cnpg-postgres-secret.yaml
      - flux/secrets/staging/cnpg-postgres-secret.yaml
    used_by: CloudNativePG (creates the role), backend and its migrations
    rotated: 2026-09-26
    runbook: docs/credential-rotation.md#database-passwords

  - name: postgres-app-production
    what: the app role of the production database
    class: cluster
    lives_in:
      - the cloud cluster, Secret production/app-postgres-app (Terraform random_password, seeded once)
      - the Terraform state
    used_by: CloudNativePG (creates the role), backend and its migrations
    runbook: docs/credential-rotation.md#database-passwords

  - name: k3s-admin-kubeconfig
    what: cluster-admin on the Hetzner cluster - the break-glass access, a client certificate
    class: cluster
    lives_in:
      - infra/terraform/hcloud_cluster/kubeconfig.yaml on the machine that applied (git-ignored, 0600)
      - the Terraform state
    used_by: Terraform providers; a person, only when OIDC sign-in is not enough
    runbook: docs/credential-rotation.md#break-glass-access

  - name: prometheus-serviceaccount-token
    what: reads the API server's, the kubelets' and CoreDNS's metrics as Prometheus - a token that never expires
    class: cluster
    lives_in:
      - each cluster, Secret observability/kube-prometheus-stack-prometheus-token (created by the kube-prometheus-stack chart, prometheus.serviceAccount.createTokenSecret)
    used_by: Prometheus - the apiserver, kubelet and coredns ServiceMonitors
    runbook: docs/credential-rotation.md#prometheus-service-account-token

  - name: alertmanager-heartbeat
    what: the URL Alertmanager pings to say it is alive - whoever holds it can fake that it is
    class: token
    lives_in:
      - flux/secrets/observability/alertmanager-heartbeat.yaml
    used_by: Alertmanager (the cloud cluster)
    rotated: 2026-09-27
    runbook: docs/credential-rotation.md#third-party-urls-and-dsns

  - name: k8s-ai-monitor-internal-token
    what: every HTTP route of the Guardian but /healthz - incidents, reports, LLM output, the alert webhook
    class: token
    lives_in:
      - flux/secrets/observability/k8s-ai-monitor-secrets.yaml (internal-token)
    used_by: k8s-ai-monitor and Alertmanager (the cloud cluster)
    rotated: 2026-10-12
    runbook: flux/infrastructure/observability/k8s-ai-monitor/README.md#rotating-internal-token

  - name: guardian-gemini-api-key
    what: calls the Gemini API on the owner's Google account - billed per request
    class: token
    lives_in:
      - flux/secrets/observability/k8s-ai-monitor-secrets.yaml (gemini-api-key)
      - infra/terraform/kind_cluster/terraform.tfvars (guardian_llm_api_key; workstation, git-ignored)
    used_by: k8s-ai-monitor (Hetzner and kind)
    rotated: 2026-10-12
    runbook: docs/credential-rotation.md#guardian-llm-key

  - name: uptrace-dsn
    what: sends traces, metrics and logs into the Uptrace project (ingest only)
    class: token
    lives_in:
      - flux/secrets/develop/backend-secrets.yaml (uptrace-dsn, uptrace-headers)
      - flux/secrets/staging/backend-secrets.yaml (uptrace-dsn, uptrace-headers)
      - flux/secrets/production/backend-secrets.yaml (uptrace-dsn, uptrace-headers)
      - GitHub organization secret UPTRACE_DSN (Hetzner workflows)
      - .env.local (UPTRACE_DSN) and .env.gcp (TF_VAR_uptrace_dsn) - workstation, git-ignored
      - infra/terraform/kind_cluster/terraform.tfvars (uptrace_dsn; workstation, git-ignored, optional)
      - Secret flux-system/cluster-secrets (uptrace_dsn), written by Terraform on each cluster
    used_by: OpenTelemetry collectors (otel-collector, otel-events), backend, frontend (the browser)
    rotated: 2026-09-23
    exposed: 2026-09-25
    accepted:
      since: 2026-10-11
      until: 2026-11-08
      reason: ingest only - a holder can add data to the project, not read it; replaced with the observability rework
    runbook: docs/credential-rotation.md#third-party-urls-and-dsns
