name: Pre-commit

# Every pre-commit hook, on every pull request and every push to main. The hooks run on the
# workstation first (make install-hooks), but `git commit --no-verify`, or a clone without the hooks
# installed, skips them there - and before this workflow nothing ran shellcheck, yamllint, checkov,
# terraform validate or the script tests anywhere else. The rules stay in .pre-commit-config.yaml;
# this workflow only runs them, so the workstation and CI can never disagree about what is checked.
#
# No path filter on purpose: a required check that does not run on some pull requests leaves them
# waiting forever. Skipped here: master-branch-check - CI checks out a detached commit, and the
# branch rule is enforced by the repository ruleset instead.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"

      # The versions the Makefile pins for the workstation (TERRAFORM_VERSION, KUBECTL_VERSION).
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      # kubectl, pinned and checked against the release's sha256 (dl.k8s.io/.../kubectl.sha256) - like Helm.
      - name: Setup kubectl
        env:
          KUBECTL_VERSION: "v1.37.1"
          KUBECTL_SHA256: "65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8"
        run: |
          curl -sSLfO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  kubectl" | sha256sum -c -
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      # flux build for check-app-security.sh: it builds every Flux Kustomization the way the
      # kustomize-controller does (no cluster). Pinned to the platform's Flux release, as in flux-diff.yml.
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: 2.9.6   # without it the action installs the latest Flux CLI

      # Helm for the tool-versions-test hook: it asks the pinned charts what they install (helm show).
      # Pinned and checked against the release's sha256sum.
      - name: Setup Helm
        env:
          # renovate: datasource=github-releases depName=helm/helm
          HELM_VERSION: "v4.3.0"
          HELM_SHA256: "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb"
        run: |
          archive="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -sSLfO "https://get.helm.sh/${archive}"
          echo "${HELM_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" --strip-components=1 linux-amd64/helm
          sudo mv helm /usr/local/bin/ && rm "${archive}"
          helm version --short

      # The Kyverno CLI for the kyverno-policies-test hook (tests/kyverno-policies.test.sh says why
      # >= 1.19). Pinned and checked against the release's checksums.txt.
      - name: Setup Kyverno CLI
        env:
          # renovate: datasource=github-releases depName=kyverno/kyverno
          KYVERNO_VERSION: "1.19.1"
          KYVERNO_SHA256: "b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae"
        run: |
          archive="kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl -sSLfO "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/${archive}"
          echo "${KYVERNO_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" kyverno && sudo mv kyverno /usr/local/bin/ && rm "${archive}"
          kyverno version

      # promtool for the platform-alerts-test hook - the version the clusters' Prometheus runs.
      # Pinned and checked against the release's sha256sums.txt.
      - name: Setup promtool
        env:
          # renovate: datasource=github-releases depName=prometheus/prometheus
          PROMETHEUS_VERSION: "3.15.0"
          PROMETHEUS_SHA256: "2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0"
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSLfO "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  ${archive}" | sha256sum -c -
          tar xzf "${archive}" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          sudo mv promtool /usr/local/bin/ && rm "${archive}"
          promtool --version

      # checkov: the terraform-security hook fails without it (it is a required tool, not optional).
      - name: Install pre-commit and checkov
        run: pip install pre-commit==4.6.2 checkov==3.3.27

      - name: Run every hook on every file
        env:
          SKIP: master-branch-check
          # The credential dates are SafeOps' own: a learner's fork cannot rotate them, and its pull
          # requests must not fail the day one of them is due. There they are reported, not enforced.
          CHECK_CREDENTIALS_DATES: ${{ github.repository == 'safeops-course/sre' && 'enforce' || 'report' }}
        run: pre-commit run --all-files --show-diff-on-failure
