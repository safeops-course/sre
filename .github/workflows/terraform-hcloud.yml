name: Terraform - Hetzner

# Plans on every pull request and every push to main that touch the Hetzner Terraform - a plan only:
# the run shows whether the change plans cleanly, and ends. Nothing is applied after a merge.
# Applying is a separate, deliberate step: Actions > Terraform - Hetzner > Run workflow (main) with
# "apply" ticked makes a fresh plan, waits for approval in the environment "production" and applies
# exactly that plan. So a run waits for a person only when someone asked to apply - before, every
# merge left an apply waiting, and a forgotten one held the concurrency group (and with it destroy
# and the e2e check) for days. Changes under flux/ are delivered by Flux itself.
# End-to-end check: hetzner-e2e.yml.
#
# The job "terraform-plan-gate" runs on every pull request, so it can be a required check: it passes
# when the pull request does not touch the Hetzner Terraform, or when its plan succeeded - and fails
# when the plan failed or was cancelled. A path filter on the workflow would leave pull requests
# without the check, waiting forever for a required check that never starts.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "infra/terraform/hcloud_cluster/**"
      - ".github/workflows/terraform-hcloud*.yml"
  # Manual run from main: a plan, and with "apply" a fresh plan that is applied after approval.
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan (after approval in the environment production)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  # Does this run concern the Hetzner Terraform? Pushes to main come here only through the path filter
  # above and manual runs always do; a pull request does when it changes these paths.
  changes:
    runs-on: ubuntu-26.04
    outputs:
      terraform: ${{ steps.diff.outputs.terraform }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Changed paths
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failing git diff must not read as "nothing changed": check it on its own.
          if ! changed="$(git diff --name-only "$BASE_SHA"...HEAD)"; then
            echo "::error::git diff against the base commit failed"
            exit 1
          fi
          if grep -qE '^(infra/terraform/hcloud_cluster/|\.github/workflows/terraform-hcloud)' <<< "$changed"; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-26.04
    # Job-level, not workflow-level: a pull request without Terraform changes must not wait in the
    # queue that the plans, the applies, the destroy and the e2e check share (never two runs on the
    # same state).
    concurrency:
      group: terraform-hcloud
      cancel-in-progress: false
      # queue: max - runs wait in order instead of the older pending one being cancelled (the default
      # keeps one pending run and cancels the rest - that is how PR plans were lost in Sep 2026).
      queue: max
    env:
      # "true" only for a manual run from main with "apply" ticked - the only run that applies.
      APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_sha256: ${{ steps.fingerprint.outputs.plan_sha256 }}
      plan_created: ${{ steps.fingerprint.outputs.plan_created }}

    defaults:
      run:
        working-directory: infra/terraform/hcloud_cluster

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Load the node SSH key into ssh-agent
        env:
          NODE_SSH_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
        run: |
          # kube-hetzner signs in to the nodes through ssh-agent (ssh_private_key = null), so the
          # private key is never a Terraform variable - neither in the saved plan nor in the state.
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$NODE_SSH_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ vars.HCLOUD_SSH_PUBLIC_KEY }}
          TF_VAR_flux_git_repository_url: https://github.com/${{ github.repository }}.git
          TF_VAR_flux_git_repository_branch: main
          TF_VAR_flux_kustomization_path: ./flux/bootstrap/profiles/hetzner
          TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}
          # The OpenTelemetry collector's export target (cluster-secrets). Sensitive, not ephemeral: it is
          # in the saved - encrypted - plan, so the apply step does not need it again.
          TF_VAR_uptrace_dsn: ${{ secrets.UPTRACE_DSN }}
          TF_VAR_backup_s3_access_key_id: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          TF_VAR_backup_s3_secret_access_key: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          TF_VAR_backup_s3_bucket: ${{ vars.BACKUP_S3_BUCKET }}
          TF_VAR_backup_s3_endpoint: ${{ vars.BACKUP_S3_ENDPOINT }}
          TF_VAR_backup_s3_region: ${{ vars.BACKUP_S3_REGION }}
        run: |
          set +e
          set -o pipefail
          terraform plan -input=false -lock-timeout=5m -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$exit_code" -eq 1 ]; then
            echo "Terraform plan failed."
            exit 1
          fi
          if [ "$exit_code" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      # What the approver reads is what gets applied: the plan text, the SHA-256 of the plan file
      # and the time it was made go to the run's summary - the page with "Review deployments".
      # The apply job refuses a file with another hash, or a plan older than PLAN_MAX_AGE_MINUTES.
      - name: Fingerprint the plan
        id: fingerprint
        if: env.APPLY == 'true' && steps.plan.outputs.has_changes == 'true'
        run: |
          echo "plan_sha256=$(sha256sum tfplan | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "plan_created=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Plan summary
        if: always() && steps.plan.outcome != 'skipped'
        env:
          PLAN_SHA256: ${{ steps.fingerprint.outputs.plan_sha256 }}
          PLAN_MAX_AGE_MINUTES: "60"
        run: |
          # The approver must see the plan: a missing plan.txt or a summary GitHub will not show
          # (over 1 MiB per step) fails here, before the plan is encrypted and uploaded.
          if [ ! -s plan.txt ]; then
            echo "::error::plan.txt is missing or empty - there is no plan to show the approver"
            exit 1
          fi
          summary="$(mktemp)"
          {
            echo "## Terraform plan (Hetzner)"
            echo
            echo "**$(grep -E '^(Plan:|No changes)' plan.txt | tail -1)**"
            if [ -n "$PLAN_SHA256" ]; then
              echo
              echo "- plan file SHA-256: \`$PLAN_SHA256\` - the apply job applies only a file with this hash"
              echo "- made at $(date -u '+%Y-%m-%d %H:%M UTC'); the apply refuses it after ${PLAN_MAX_AGE_MINUTES} minutes - then re-run the workflow for a fresh plan"
              echo "- approve only what you read below: this is the plan that will run, not the one from the pull request"
            elif [ "$GITHUB_EVENT_NAME" != "pull_request" ] && grep -q '^Plan:' plan.txt; then
              echo
              echo "- **not applied** - this run only plans. To apply: Actions > Terraform - Hetzner > Run workflow (branch main), tick \"apply\"; that makes a fresh plan and waits for approval"
            fi
            echo
            echo "<details><summary>Full plan</summary>"
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo "</details>"
          } > "$summary"
          size="$(wc -c < "$summary")"
          if [ "$size" -gt 1000000 ]; then
            echo "::error::the plan summary is ${size} bytes; GitHub shows at most 1 MiB per step, so the approver could not read the plan - split the change"
            exit 1
          fi
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"

      # A saved plan holds every non-ephemeral input variable in plain text - the Hetzner token
      # and the backup keys (the SOPS age key is ephemeral, the node SSH key goes through
      # ssh-agent) - and artifacts of a public repository can be downloaded by any GitHub user.
      # Only the encrypted file leaves this job; the apply job decrypts it and replays the plan.
      - name: Encrypt tfplan
        if: env.APPLY == 'true' && steps.plan.outputs.has_changes == 'true'
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          if [ -z "$TFPLAN_PASSPHRASE" ]; then
            echo "::error::secret TFPLAN_PASSPHRASE is not set - the plan is never uploaded unencrypted"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:TFPLAN_PASSPHRASE -in tfplan -out tfplan.enc
          rm -f tfplan

      - name: Upload encrypted tfplan
        if: env.APPLY == 'true' && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terraform-hcloud-tfplan
          path: |
            infra/terraform/hcloud_cluster/tfplan.enc
            infra/terraform/hcloud_cluster/plan.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    runs-on: ubuntu-26.04
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == 'true'
    # Approval: the "production" environment requires a reviewer (Settings > Environments). The job
    # waits in the run page ("Review deployments") - no issue, no third-party action with a token.
    environment: production
    concurrency:
      group: terraform-hcloud
      cancel-in-progress: false
      # queue: max - runs wait in order instead of the older pending one being cancelled (the default
      # keeps one pending run and cancels the rest - that is how PR plans were lost in Sep 2026).
      queue: max

    defaults:
      run:
        working-directory: infra/terraform/hcloud_cluster

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubectl
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"

      - name: Load the node SSH key into ssh-agent
        env:
          NODE_SSH_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
        run: |
          # kube-hetzner signs in to the nodes through ssh-agent (ssh_private_key = null), so the
          # private key is never a Terraform variable - neither in the saved plan nor in the state.
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$NODE_SSH_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Download tfplan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: terraform-hcloud-tfplan
          path: infra/terraform/hcloud_cluster

      - name: Decrypt tfplan
        env:
          TFPLAN_PASSPHRASE: ${{ secrets.TFPLAN_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:TFPLAN_PASSPHRASE -in tfplan.enc -out tfplan
          rm -f tfplan.enc

      - name: Apply only the reviewed plan, and only while it is fresh
        env:
          PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
          PLAN_CREATED: ${{ needs.plan.outputs.plan_created }}
          PLAN_MAX_AGE_MINUTES: "60"
        run: |
          if [ -z "$PLAN_SHA256" ] || [ -z "$PLAN_CREATED" ]; then
            echo "::error::the plan job reported no hash or time - refusing to apply an unidentified plan"
            exit 1
          fi
          actual="$(sha256sum tfplan | cut -d' ' -f1)"
          if [ "$actual" != "$PLAN_SHA256" ]; then
            echo "::error::this plan file ($actual) is not the one shown in the run summary ($PLAN_SHA256)"
            exit 1
          fi
          age_seconds=$(( $(date +%s) - PLAN_CREATED ))
          if [ "$age_seconds" -gt $(( PLAN_MAX_AGE_MINUTES * 60 )) ]; then
            echo "::error::the plan is ${age_seconds}s old (limit ${PLAN_MAX_AGE_MINUTES} minutes); reality may have moved under it - re-run the workflow for a fresh plan and review it again"
            exit 1
          fi
          echo "applying exactly the reviewed plan $actual (${age_seconds}s old)"

      - name: Terraform apply
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # ephemeral: not in the saved plan, so the apply must be given it again
          TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}
        run: terraform apply -input=false -lock-timeout=5m tfplan

  # The required check of a pull request (add "terraform-plan-gate" to the ruleset on main). It runs
  # on every pull request: green when the pull request does not touch the Hetzner Terraform, or when
  # its plan succeeded; red when the plan failed, was cancelled or did not run although it should.
  # A pull request from a fork gets no secrets, so a fork's Terraform change fails here.
  terraform-plan-gate:
    needs: [changes, plan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - name: Plan result
        env:
          CHANGES: ${{ needs.changes.result }}
          TERRAFORM: ${{ needs.changes.outputs.terraform }}
          PLAN: ${{ needs.plan.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::could not tell whether this pull request changes the Hetzner Terraform (changes: $CHANGES)"
            exit 1
          fi
          if [ "$TERRAFORM" != "true" ]; then
            echo "No Hetzner Terraform change - nothing to plan."
            exit 0
          fi
          if [ "$PLAN" != "success" ]; then
            echo "::error::the Terraform plan of this pull request did not succeed (plan: $PLAN)"
            exit 1
          fi
          echo "The Terraform plan of this pull request succeeded."
