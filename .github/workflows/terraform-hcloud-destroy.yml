name: Terraform - Destroy (Hetzner)

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Same group as plan/apply and the e2e check: never two runs against the same state (the state
# lock alone would make the second run fail after -lock-timeout instead of waiting its turn).
concurrency:
  group: terraform-hcloud
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm destroy string
        env:
          CONFIRM_DESTROY: ${{ github.event.inputs.confirm_destroy }}
        run: |
          [ "$CONFIRM_DESTROY" = "DESTROY" ] || {
            echo "Invalid confirmation value. You must type DESTROY."
            exit 1
          }

  destroy:
    runs-on: ubuntu-latest
    needs: guard
    # Approval: the "production" environment requires a reviewer (Settings > Environments). The job
    # waits in the run page ("Review deployments") - no issue, no third-party action with a token.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup kubectl (needed for FluxInstance cleanup via Terraform)
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Load the node SSH key into ssh-agent
        env:
          NODE_SSH_KEY: ${{ secrets.HCLOUD_SSH_PRIVATE_KEY }}
        run: |
          # kube-hetzner signs in to the nodes through ssh-agent (ssh_private_key = null), so the
          # private key is never a Terraform variable - neither in the saved plan nor in the state.
          eval "$(ssh-agent -s)" > /dev/null
          printf '%s\n' "$NODE_SSH_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      # flux-pre-destroy.sh needs the kubeconfig to clean up inside the cluster before the nodes go
      # (volumes the CSI driver created are not in the state). A fresh runner has no kubeconfig.yaml
      # - write it from the state.
      - name: Write the kubeconfig from the state
        working-directory: infra/terraform/hcloud_cluster
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -input=false
          if terraform output -raw kubeconfig > kubeconfig.yaml 2>/dev/null && [ -s kubeconfig.yaml ]; then
            chmod 600 kubeconfig.yaml
          else
            rm -f kubeconfig.yaml
            echo "::warning::no kubeconfig in the state - the cluster-side cleanup will be skipped"
          fi

      - name: Destroy infrastructure via Makefile target
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_ssh_public_key: ${{ vars.HCLOUD_SSH_PUBLIC_KEY }}
          TF_VAR_flux_git_repository_url: https://github.com/${{ github.repository }}.git
          TF_VAR_flux_git_repository_branch: main
          TF_VAR_flux_kustomization_path: ./flux/bootstrap/flux-system
          TF_VAR_sops_age_key: ${{ secrets.SOPS_AGE_KEY }}
          TF_VAR_backup_s3_access_key_id: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          TF_VAR_backup_s3_secret_access_key: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          TF_VAR_backup_s3_bucket: ${{ vars.BACKUP_S3_BUCKET }}
          TF_VAR_backup_s3_endpoint: ${{ vars.BACKUP_S3_ENDPOINT }}
          TF_VAR_backup_s3_region: ${{ vars.BACKUP_S3_REGION }}
          TF_INPUT: "false"
          TF_CLI_ARGS_destroy: "-auto-approve -lock-timeout=5m"
        run: make terraform-hcloud-destroy

      - name: Nothing left in Hetzner
        if: always()
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: scripts/hcloud-leftovers.sh
