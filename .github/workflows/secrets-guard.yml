name: Secrets guard

# The same checks as the pre-commit hooks, on every pull request and push to main - a commit made
# with `git commit --no-verify` (or without the hooks installed) skips them locally, not here.
#   no-secrets      kubeconfigs, private keys, credentials and .env files are never committed
#   sops-encrypted  every manifest under flux/secrets/ is SOPS-encrypted
#   gitleaks        no secret in the CONTENT of any commit - a token pasted into a values file,
#                   a script or a doc, which the two checks above cannot see (Chapter 21)
# The rules live in .pre-commit-config.yaml, .gitleaks.toml and the scripts they call; this workflow
# only runs them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: No sensitive files in the repository
        run: pre-commit run no-secrets --all-files --show-diff-on-failure

      - name: Everything under flux/secrets/ is SOPS-encrypted
        run: pre-commit run sops-encrypted --all-files --show-diff-on-failure

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # renovate: datasource=github-releases depName=gitleaks/gitleaks
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      # The whole history: a secret committed and removed in a later commit is still readable in Git.
      - name: Checkout (full history)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pre-commit hook and this job must run the same rules: one version, pinned twice.
      - name: Same gitleaks version as the pre-commit hook
        run: |
          hook="$(yq '.repos[] | select(.repo == "https://github.com/gitleaks/gitleaks") | .rev' .pre-commit-config.yaml)"
          [ "${hook#v}" = "${GITLEAKS_VERSION}" ] || {
            echo "gitleaks: the pre-commit hook pins ${hook}, this job ${GITLEAKS_VERSION} - bump them together" >&2
            exit 1
          }

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          rm "${archive}"

      # Every commit, including what a merge commit changes (first-parent diff: a conflict resolution).
      # A few hundred commits take well under a second. --redact keeps a finding's value out of the log.
      - name: Scan the history
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all --diff-merges=first-parent" .
