name: Secrets guard

# The same two checks as the pre-commit hooks, on every pull request and push to main - a commit made
# with `git commit --no-verify` (or without the hooks installed) skips them locally, not here.
#   no-secrets      kubeconfigs, private keys, credentials and .env files are never committed
#   sops-encrypted  every manifest under flux/secrets/ is SOPS-encrypted
# The rules live in .pre-commit-config.yaml and the scripts it calls; this workflow only runs them.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: No sensitive files in the repository
        run: pre-commit run no-secrets --all-files --show-diff-on-failure

      - name: Everything under flux/secrets/ is SOPS-encrypted
        run: pre-commit run sops-encrypted --all-files --show-diff-on-failure
