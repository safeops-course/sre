<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  {{ $style := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">{{ site.Title }}</a>
      <nav>
        {{ range site.Menus.main }}
          <a href="{{ .URL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  {{ if and .IsPage (in .RelPermalink "/quiz/") }}
  <script>
    window.__QUIZ_CONFIG = {
      pageId: "{{ .RelPermalink }}",
      apiEndpoint: "{{ with site.Params.quizApiEndpoint }}{{ . }}{{ end }}"
    };
  </script>
  {{ $quiz := resources.Get "js/quiz.js" | minify | fingerprint }}
  <script defer src="{{ $quiz.RelPermalink }}" integrity="{{ $quiz.Data.Integrity }}"></script>
  {{ end }}
</body>
</html>
