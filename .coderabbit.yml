# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repo-specific rules. Organization defaults (language, tone, workflows, Dockerfile, shell,
# *.example, CLAUDE/AGENT docs, pre-merge checks off, knowledge base scopes) come from
# safeops-course/coderabbit/.coderabbit.yaml through `inheritance: true`.
# CodeRabbit config for safeops-course/sre (public). This file is taught in
# chapter-05-cicd-developer-guardrails (course-map.yml) - a change here opens a
# snippet-sync PR in safeops-course/sre-course.
#
# Linters run with their defaults (every tool is enabled by default in the schema).
# They are tuned through repo-native files, not here:
#   yamllint   .yamllint.yaml  (none yet: "chill" = relaxed rule set, same as pre-commit)
#   checkov    .checkov.yaml   (none yet)
#   tflint     .tflint.hcl     (none yet)
#   zizmor     .github/zizmor.yml (none yet)
tone_instructions: >-
  Concise and factual. Severity follows real worst-case impact, not style. Block on secret leaks, unpinned versions, missing manual gates and silent failures. Every finding names the file:line, the impact and a concrete fix. No praise, no filler.
reviews:
  profile: chill # assertive switches yamllint to the default rule set (~390 findings on main today)
  request_changes_workflow: true
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # base_branches: [] (default) = only PRs into main are auto-reviewed.
  path_filters:
    # flux/secrets/** stays in scope on purpose: a plaintext Secret committed there must be seen.
    - "!**/.terraform/**"
  path_instructions:
    - path: "**"
      instructions: |
        Platform repo for the SafeOps SRE course: Terraform (infra/terraform), Flux GitOps (flux/), guard scripts (scripts/).
        Principles: KISS, explicit over implicit, fail loudly, guardrails, no plaintext secrets in git (SOPS+age only), pinned versions.
        Course impact: if a changed, renamed or deleted file is a key in course-map.yml, name its chapters. On push to main,
        sync-course-snippets.yml opens a PR in safeops-course/sre-course and fails when a snippet source path is missing,
        so a rename/delete of a mapped file needs a matching course PR.
    - path: "infra/terraform/**/*.tf"
      instructions: |
        hcloud_cluster: kube-hetzner module (exact version), S3 backend on Cloudflare R2 with use_lockfile.
        kind_cluster: local state, kind provider; local-profile.tf creates the kind-only runtime Secrets.
        - Providers: every one has a version constraint; modules use an exact version.
        - Secrets arrive as TF_VAR_* (load-env.sh / GitHub secrets); such variables must be sensitive = true with no real default.
        - helm/kubernetes providers read module.kube_hetzner.kubeconfig_data (hcloud) - do not switch them to a kubeconfig file.
        - Create-time local-exec must fail the apply. Only destroy-time provisioners may use on_failure = continue, and they need a bounded --timeout.
        - ConfigMaps cluster-config and backup-s3 are consumed by Flux postBuild.substituteFrom: renaming a key breaks flux/bootstrap/flux-system/*.yaml.
        - k3s_version is pinned and auto_upgrade_k3s = false; flag changes that let Kubernetes upgrade itself.
    - path: "infra/terraform/**/terraform.tfvars"
      instructions: |
        Committed on purpose and holds only non-secret values. Flag any token, key, password or private key here.
    - path: "flux/**"
      instructions: |
        Flux Operator + Kustomizations. Entry: flux/bootstrap/flux-system (infrastructure.yaml, secrets.yaml, apps.yaml); flux/bootstrap/profiles/local = kind.
        - dependsOn: namespace/operator before consumers; a Kustomization that uses a Secret from flux/secrets depends on its secrets-* Kustomization.
        - HelmRelease chart versions are exact (no ranges); Terraform modules exact, providers constrained; actions and tool downloads pinned. Images use a fixed tag or digest; backend:latest / frontend:latest in apps/*/base are
          placeholders replaced by the overlay images transformer; ":main" with a $imagepolicy marker is managed by image automation.
        - postBuild variables must exist in ConfigMap cluster-config / backup-s3 or Secret cluster-secrets.
        - NetworkPolicies: default-deny-all per env; ingress to apps only from namespace traefik; every new workload needs explicit rules.
        - Ingress: ingressClassName traefik + cert-manager.io/cluster-issuer; ClusterIssuers use DNS-01 via Cloudflare.
        - A kind: Secret with real values belongs only in flux/secrets/** and SOPS-encrypted.
        - production/app-postgres-app is generated by Terraform (hcloud and kind), never a Secret under flux/infrastructure.
        - Image automation pushes to main over ssh:// with the deploy key from flux/secrets/flux-system; the image-automation Kustomization depends on secrets-flux-system.
    - path: "flux/secrets/**"
      instructions: |
        SOPS+age files decrypted by Flux (decryption.secretRef sops-age). Do not review or comment on ciphertext, MAC, lastmodified or other sops: metadata - a re-encryption changes every line by design. Check only the structure below.
        - Every *.yaml except kustomization.yaml has a top-level sops: block and ENC[...] values under data/stringData.
        - encrypted_regex and the recipient match the .sops.yaml rule for that directory; metadata.namespace matches the environment.
        - *.yaml.example files hold placeholders only (change-me style) and are not listed in kustomization.yaml.
    - path: "flux/apps/**/patches/**"
      instructions: |
        Strategic-merge patches, partial by design: do not ask for securityContext, probes or resources that come from base/.
    - path: "flux/infrastructure/policy/packs/**"
      instructions: |
        Kyverno ClusterPolicies. *.example.yaml are teaching examples, not in kustomization.yaml - do not ask to include them.
        Flag a policy switched from Audit to Enforce (or back) without a note in the PR description.
    - path: "flux/infrastructure/data/migrations/*.sql"
      instructions: |
        Expand/contract examples run by hand with psql. Expand must stay backward-compatible and idempotent (IF [NOT] EXISTS);
        contract is destructive and must keep its preconditions header.
    - path: ".github/workflows/**"
      instructions: |
        - terraform apply/destroy (and the Hetzner e2e) runs only in a job with `environment: production` (required reviewer, deployment branches = main); no issue-based manual-approval actions. Concurrency cancel-in-progress: false.
        - Never trigger apply/destroy from pull_request or pull_request_target.
        - Inputs and event fields reach run: only through env:, never ${{ }} inside the script.
        - terraform-hcloud uploads the saved plan only encrypted (openssl, secret TFPLAN_PASSPHRASE) and the apply job decrypts it; never upload a plain tfplan, state, kubeconfig or .env - this repo is public.
        - Actions and downloaded tools are pinned (no @main/@master); least-privilege permissions per job.
        - A validation step must fail the job; no silent skips of missing paths.
    - path: "**/*.sh"
      instructions: |
        - Executed scripts: set -Eeuo pipefail (set -e minimum), quoted expansions, argument checks before shift, clear error messages.
        - load-env.sh is sourced: it must not use set -e or exit (return instead).
        - Destroy-time helpers (infra/terraform/scripts/flux-pre-destroy.sh) are best-effort but must print what they skipped.
        - Guards (scripts/guard-*.sh, block-secrets.sh) must fail closed.
    - path: "**/Makefile"
      instructions: |
        - .PHONY lists exactly the defined targets.
        - hcloud_cluster destroy: targeted destroy of null_resource.flux_pre_destroy, state rm of Flux and kubernetes_/helm_ resources, then terraform destroy.
        - kind_cluster destroy: kind delete cluster + state-clean (local state).
        - state-clean removes everything from state: flag any new caller of it.
    - path: ".pre-commit-config.yaml"
      instructions: |
        - default_install_hook_types covers every stage used; hook repos pinned to a tag or SHA.
        - terraform fmt uses -check; checkov never gets --soft-fail; prepare-commit-msg hooks use pass_filenames: false.
    - path: ".sops.yaml"
      instructions: |
        One creation rule per flux/secrets/<dir>, encrypted_regex ^(data|stringData)$. The flux/secrets/local recipient is a
        placeholder on purpose (written by scripts/sops-setup.sh --local).
    - path: "course-map.yml"
      instructions: |
        Generated by safeops-course/sre-course scripts/generate-course-map.sh (make course-map there). Do not edit by hand;
        every key must be an existing path in this repo.
    - path: "**/*.md"
      instructions: |
        CLAUDE.md, READMEs and docs/ are read by people and agents (CLAUDE.md is also a CodeRabbit guideline source):
        commands, paths, versions, make targets and workflow triggers must match the code. No tokens or keys.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "docs/ai-code-of-conduct.md"
      - "course-map.yml"
chat:
  auto_reply: false
inheritance: true
