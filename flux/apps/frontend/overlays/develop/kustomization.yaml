apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: develop
resources:
  - ../../base
  - image-policy.yaml
  - image-automation.yaml
  - hpa.yaml
  - pdb.yaml
images:
  - name: frontend
    newName: ${image_registry}/frontend
    newTag: develop-v0.0.0-e5c5eb0-1790436213 # {"$imagepolicy": "develop:frontend:tag"}
patches:
  - path: patches/deployment.yaml
  - path: patches/ingress.yaml
