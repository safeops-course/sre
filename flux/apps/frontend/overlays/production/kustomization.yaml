    newName: ${image_registry}/frontend
    newTag: production-v0.0.0-c8ce1fd-1792157206 # {"$imagepolicy": "production:frontend:tag"}
patches:
  - path: patches/deployment.yaml
  - path: patches/ingress.yaml
