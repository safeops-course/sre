apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: develop
namePrefix: ""
labels:
  - pairs:
      environment: develop
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - image-policy.yaml
  - image-automation.yaml
  - hpa.yaml
  - pdb.yaml
# Feature flags of the develop backend (Chapter 18), read through envFrom (the last patch below). A
# generator, not a plain ConfigMap: its name gets a hash of the values, so changing a flag changes the
# name the Deployment refers to - and Flux rolls the pods. A plain ConfigMap would change while the
# running pods kept the old value until something else restarted them.
configMapGenerator:
  - name: feature-flags
    literals:
      - FEATURE_DISPLAY_NAME=false # return display_name in register/login (schema version 2)
images:
  - name: backend
    newName: ${image_registry}/backend
    newTag: develop-v0.0.0-a3b31ee-1791658544 # {"$imagepolicy": "develop:backend:tag"}
patches:
  # The backend reads backend-secrets and app-postgres-app as env vars, once, at start. A rotation sets
  # this to the current UTC time (date -u +%FT%TZ) in the same pull request as the Secret: the pod template changes, and Flux rolls the pods
  # like any release. Not `kubectl rollout restart` - Flux removes its annotation on the next reconcile
  # and, mid-rollout, keeps the old pods with the old value (docs/credential-rotation.md).
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          metadata:
            annotations:
              safeops.io/secrets-rotated: "2026-09-26T00:00:00Z"
  # Chaos labs (Ch11/13/14/15/19) use /panic and the probe toggles here. Production keeps the base: off.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - name: CHAOS_ENABLED
                    value: "true"
  # Develop runs smaller than production (the base); scripts/check-app-resources.sh keeps production
  # >= develop and staging == production, and checks the worst case against each namespace quota.
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "25m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "64Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "25m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "256Mi"
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: feature-flags
    target:
      kind: Deployment
      name: backend
