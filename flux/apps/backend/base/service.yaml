---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  # Both families or no Service at all: on a single-stack cluster this fails loudly (the cluster must be
  # dual-stack - every cluster of the platform is), instead of quietly leaving IPv6 out.
  ipFamilyPolicy: RequireDualStack
  ipFamilies: [IPv4, IPv6]
  type: ClusterIP
  sessionAffinity: None
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: backend
