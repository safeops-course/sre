---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
spec:
  # Both families or no Service at all: on a single-stack cluster this fails loudly, instead of quietly
  # leaving IPv6 out. The platform runs dual-stack where the provider has IPv6 by default; a provider
  # without it sets cluster-config service_ip_family_policy to PreferDualStack in its Terraform, as a
  # written exception (docs/providers.md). No ipFamilies list: RequireDualStack alone asks for both
  # (the cluster's primary family first), and a listed IPv6 would be refused where there is none.
  ipFamilyPolicy: ${service_ip_family_policy:=RequireDualStack}
  type: ClusterIP
  sessionAffinity: None
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: backend
