---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system-image-automation
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  # Pushes image tag updates back to main. Auth: a repo deploy key with write access
  # (SOPS: flux/secrets/flux-system) - not tied to a person, does not expire. The repo is
  # public, so the main flux-system GitRepository needs no credentials at all.
  secretRef:
    name: flux-image-automation-deploy-key
  url: ssh://git@ssh.github.com:443/${git_owner}/sre.git
