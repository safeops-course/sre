---
# Watchdog -> Healthchecks.io heartbeat (see kustomization.yaml).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alerting
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/observability/alerting
  prune: true
  wait: true
  dependsOn:
    - name: observability
    - name: secrets-observability
