---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: image-automation
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/bootstrap/infrastructure/image-automation
  prune: true
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
  dependsOn:
    - name: infrastructure
    # the deploy key the automation pushes with (flux/secrets/flux-system)
    - name: secrets-flux-system
