# OPT-IN (Ch19 Progressive Delivery): the frontend canary in develop.
#
# Not listed in kustomization.yaml, so Flux ignores this file until Ch19. To enable, add
#   - progressive-delivery-develop.yaml
# to the resources in flux/bootstrap/flux-system/kustomization.yaml (pull request, merge).
# Until then develop gets a plain rolling update from the app Kustomizations.
#
# Disabling again is safe: the Canary sets revertOnDeletion, so Flagger restores the frontend
# Deployment and Service before it removes its primary objects. Not yet verified on Hetzner - see
# flux/infrastructure/progressive-delivery/README.md.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: progressive-delivery-develop
  namespace: flux-system
spec:
  interval: 10m0s
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/progressive-delivery/develop
  prune: true
  wait: false
  dependsOn:
    - name: flagger
    - name: traefik   # IngressRoute and TraefikService come with its chart
    - name: apps-develop
