    # BACKUP_S3_ENDPOINT / BACKUP_S3_BUCKET: written by Terraform from the same inputs
    # as the cnpg-backup-s3 Secret and the etcd snapshots (BACKUP_S3_* in GitHub);
    # BACKUP_CLUSTER_ID: when Terraform created this cluster - part of the archive's serverName.
    substituteFrom:
      - kind: ConfigMap
        name: backup-s3
  dependsOn:
    - name: cnpg-operator
    - name: network-policies-develop
    - name: resource-management-develop
