---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/bootstrap/infrastructure/base
  prune: true
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/security/cert-manager
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: infrastructure
---
# Traefik, the ingress of every cluster (see release.yaml). Each profile patches how its Service is
# reached (profiles/hetzner: the Hetzner load balancer; profiles/local: a NodePort on kind).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/ingress/traefik
  prune: true
  wait: true
  timeout: 10m0s
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
  dependsOn:
    - name: infrastructure
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/data/cnpg-operator
  prune: true
  wait: true
  timeout: 10m0s
  dependsOn:
    - name: infrastructure
    - name: cert-manager # the Barman Cloud plugin's certificates
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-cluster-develop
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/infrastructure/data/cnpg-clusters/develop
  prune: true
  wait: false
  postBuild:
    # BACKUP_S3_ENDPOINT / BACKUP_S3_BUCKET: written by Terraform from the same inputs
    # as the cnpg-backup-s3 Secret and the etcd snapshots (BACKUP_S3_* in GitHub);
    # BACKUP_CLUSTER_ID: when Terraform created this cluster - part of the archive's serverName.
    substituteFrom:
      - kind: ConfigMap
        name: backup-s3
  dependsOn:
    - name: cnpg-operator
    - name: network-policies-develop
    - name: resource-management-develop
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
