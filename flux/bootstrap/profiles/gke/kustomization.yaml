# GKE profile: the full platform on the GKE cluster (infra/terraform/gke_cluster) - the same as on
# Hetzner. Clusters of the two providers never run at the same time: they share the DNS names (one
# external-dns owner) and image automation writes to the same branch.
#
#   base         flux/bootstrap/flux-system - what every cluster runs
#   components   every one, as on Hetzner
#   patches      Traefik's LoadBalancer Service gets GKE's backend-service load balancer class - the
#                only one with a dual-stack (IPv4 + IPv6) external passthrough load balancer before GKE
#                1.37, where it becomes the default. GKE deletes the load balancer with the Service (the
#                destroy removes the Service first: infra/terraform/gke_cluster/flux.tf)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../flux-system
components:
  - ../../components/platform-secrets
  - ../../components/public-edge
  - ../../components/image-automation
  - ../../components/alerting
  - ../../components/opentelemetry
patches:
  # Point the self-managing Kustomization at this profile.
  - target: { kind: Kustomization, name: flux-system }
    patch: |-
      - op: replace
        path: /spec/path
        value: ./flux/bootstrap/profiles/gke

  # --- Traefik: a dual-stack load balancer -----------------------------------
  # The base Service asks for both families (RequireDualStack). GKE gives a LoadBalancer Service an IPv6
  # forwarding rule only with the backend-service based external passthrough load balancer; before 1.37
  # that needs this class (immutable - set when the Service is created, as every cycle does).
  # https://cloud.google.com/kubernetes-engine/docs/concepts/service-load-balancer-parameters
  - target: { kind: Kustomization, name: traefik }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: HelmRelease, name: traefik }
            patch: |-
              apiVersion: helm.toolkit.fluxcd.io/v2
              kind: HelmRelease
              metadata: { name: traefik }
              spec:
                values:
                  service:
                    spec:
                      loadBalancerClass: networking.gke.io/l4-regional-external

  # --- NetworkPolicies: GKE's Pod IPv6 is global ------------------------------
  # With EXTERNAL IPv6 the Pods' addresses come from the subnet's global range, not from fc00::/7, so
  # allow-backend-egress-https (443 to the internet) would also reach other Pods over IPv6. Its ::/0 gets
  # that range cut out too - the subnet's range from cluster-config (Terraform), as 10.0.0.0/8 is cut
  # out of 0.0.0.0/0. postBuild fills ${cluster_ipv6_range} in; nothing else here uses a variable.
  - target: { kind: Kustomization, name: "network-policies-(develop|staging|production)" }
    patch: |-
      - op: add
        path: /spec/postBuild
        value:
          substituteFrom:
            - kind: ConfigMap
              name: cluster-config
      - op: add
        path: /spec/patches
        value:
          - target: { kind: NetworkPolicy, name: allow-backend-egress-https }
            patch: |-
              - op: test
                path: /spec/egress/0/to/1/ipBlock/cidr
                value: "::/0"
              - op: add
                path: /spec/egress/0/to/1/ipBlock/except/-
                value: "${cluster_ipv6_range}"
