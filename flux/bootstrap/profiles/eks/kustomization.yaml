# EKS profile: the full platform on the EKS cluster (infra/terraform/eks_cluster) - the same as on
# Hetzner and GKE. Clusters of different providers never run at the same time: they share the DNS names
# (each provider has its own external-dns owner ID, from cluster-config cloud_provider, so the first one
# keeps them) and image automation writes to the same branch.
#
#   base         flux/bootstrap/flux-system - what every cluster runs
#   components   every one, as on Hetzner and GKE
#   patches      Traefik's LoadBalancer Service gets a Network Load Balancer from the AWS Load Balancer
#                Controller (installed by Terraform, which also deletes the NLB with the Service on
#                destroy: infra/terraform/eks_cluster/flux.tf), IPv4 only - the written exception of
#                docs/providers.md (the apps' Services take it from cluster-config service_ip_family_policy)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../flux-system
components:
  - ../../components/platform-secrets
  - ../../components/public-edge
  - ../../components/image-automation
  - ../../components/alerting
  - ../../components/opentelemetry
patches:
  # Point the self-managing Kustomization at this profile.
  - target: { kind: Kustomization, name: flux-system }
    patch: |-
      - op: replace
        path: /spec/path
        value: ./flux/bootstrap/profiles/eks

  # --- Traefik: a Network Load Balancer, IPv4 --------------------------------
  # loadBalancerClass hands the Service to the Load Balancer Controller (the legacy in-tree controller
  # would make a Classic Load Balancer). IP targets: the NLB sends to the Traefik pods directly, not
  # through a node port. preserve_client_ip: the packets keep the client's address, so Traefik's
  # access log and the apps see the real client - no PROXY protocol. The class and the annotations are
  # read when the Service is created (every cycle creates it).
  # An EKS cluster has no dual-stack pods or Services (docs/providers.md): PreferDualStack takes the one
  # family there is, and ipFamilies goes - a listed IPv6 would be refused.
  # https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/guide/service/annotations/
  - target: { kind: Kustomization, name: traefik }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: HelmRelease, name: traefik }
            patch: |-
              - op: replace
                path: /spec/values/service/spec/ipFamilyPolicy
                value: PreferDualStack
              - op: remove
                path: /spec/values/service/spec/ipFamilies
              - op: add
                path: /spec/values/service/spec/loadBalancerClass
                value: service.k8s.aws/nlb
              - op: add
                path: /spec/values/service/annotations
                value:
                  service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
                  service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
                  service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
