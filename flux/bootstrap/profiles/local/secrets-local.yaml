---
# The learner's own SOPS-encrypted secrets (Chapter 03). Starts empty; the
# sops-age key is generated by infra/terraform/kind_cluster on first apply and
# scripts/sops-setup.sh registers its public half in .sops.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets-local
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./flux/secrets/local
  prune: true
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: infrastructure
