# Local (kind) profile.
#
# The base (flux/bootstrap/flux-system) and none of the components: each needs something kind does not
# have - a DNS zone and a load balancer (public-edge), a Git write token (image-automation), alert
# receivers (alerting), an Uptrace DSN (opentelemetry), the platform's SOPS key (platform-secrets).
# What is added:
#   - minio          S3-compatible target for CNPG backups instead of Hetzner Object Storage
#   - secrets-local  the learner's own SOPS-encrypted secrets (secrets chapter)
#   - lab            scratch namespace with Pod Security warn/audit (admission-policy drills)
# What stays although kind has no DNS zone: cert-manager - the Barman Cloud plugin of CloudNativePG makes
# its certificates with it (no Cloudflare issuer on kind).
# What stays although nobody signs in through OIDC here: oidc-rbac - the roles of the GitHub teams and
# the policy on Flux fields. They need no Dex; `kubectl --as=<user> --as-group=safeops-course:members`
# shows what a person in that team may do (Chapter 21).
# Runtime secrets the apps need (JWT, Postgres owner, MinIO creds, sops-age)
# are created by infra/terraform/kind_cluster at cluster creation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../flux-system
  - minio.yaml
  - secrets-local.yaml
  - lab.yaml
  - alerting-routing.yaml
patches:
  # Point the self-managing Kustomization at this profile, not at the base.
  - target: { kind: Kustomization, name: flux-system }
    patch: |-
      - op: replace
        path: /spec/path
        value: ./flux/bootstrap/profiles/local

  # --- the Guardian without image automation ---------------------------------
  # The Guardian (k8s-ai-monitor, Chapter 14) runs on kind too. Its Secret comes from Terraform
  # (guardian_llm_provider / guardian_llm_api_key), not from secrets-observability; and kind has no
  # image automation, so its ImagePolicy and ImageUpdateAutomation are left out - the tag changes
  # only by a commit, as for every app on kind (Chapter 10). LLM_DEBUG is on, for the lab.
  - target: { kind: Kustomization, name: k8s-ai-monitor }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - patch: |-
              apiVersion: image.toolkit.fluxcd.io/v1
              kind: ImagePolicy
              metadata: { name: k8s-ai-monitor, namespace: observability }
              $patch: delete
          - patch: |-
              apiVersion: image.toolkit.fluxcd.io/v1
              kind: ImageUpdateAutomation
              metadata: { name: k8s-ai-monitor, namespace: observability }
              $patch: delete
          # Keep every LLM request and response (GET /llm-debug, 7 days): on kind you see
          # exactly what left the cluster, already redacted (Chapter 14).
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: k8s-ai-monitor }   # no namespace: deployment.yaml has none yet
              spec:
                template:
                  spec:
                    containers:
                      - name: k8s-ai-monitor
                        env:
                          - name: LLM_DEBUG
                            value: "true"

  # --- cert-manager: certificates for the Barman Cloud plugin only ---------
  # On kind it signs the plugin's mTLS certificates and nothing else: the Ingresses carry the Hetzner
  # issuer annotation (Cloudflare Origin CA), which does not exist here, so the ingress-shim controller
  # is off - otherwise it creates a frontend-tls Certificate per environment that can never be issued.
  - target: { kind: Kustomization, name: cert-manager }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: HelmRelease, name: cert-manager }
            patch: |-
              - op: add
                path: /spec/values/extraArgs
                value: ["--controllers=*,-ingress-shim"]

  # --- Traefik: a NodePort instead of a cloud load balancer -----------------
  # kind has no load balancer: the Service is a NodePort on 30080/30443, which kind's port mappings
  # (infra/terraform/kind_cluster) publish as localhost:8080/8443. No HTTPS redirect (the labs use
  # http://localhost:8080), no PROXY protocol, one replica, no autoscaling - the values the kind
  # cluster's Terraform set before Traefik moved to Flux.
  - target: { kind: Kustomization, name: traefik }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: HelmRelease, name: traefik }
            patch: |-
              - op: replace
                path: /spec/values
                value:
                  service:
                    spec:
                      type: NodePort
                  ports:
                    web:
                      nodePort: 30080
                    websecure:
                      nodePort: 30443
                  providers:
                    kubernetesIngress:
                      enabled: true
                    kubernetesCRD:
                      enabled: true

  # --- observability no longer waits for cert-manager -----------------------
  - target: { kind: Kustomization, name: observability }
    patch: |-
      - op: replace
        path: /spec/dependsOn
        value:
          - name: infrastructure

  # --- CNPG clusters: wait for MinIO ---------------------------------------
  # Endpoint, bucket and keys point at MinIO already: Terraform writes them
  # (ConfigMap flux-system/backup-s3, Secret cnpg-backup-s3).
  - target: { kind: Kustomization, name: cnpg-cluster-develop }
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value: { name: minio }
  - target: { kind: Kustomization, name: cnpg-cluster-staging }
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value: { name: minio }
  - target: { kind: Kustomization, name: cnpg-cluster-production }
    patch: |-
      - op: add
        path: /spec/dependsOn/-
        value: { name: minio }

  # --- apps: no image automation locally -----------------------------------
  # apps-<env> renders flux/bootstrap/apps/<env>, which creates the
  # backend-<env>/frontend-<env> Kustomizations and a ResourceSetInputProvider
  # that scans GHCR. Drop the provider, and give the inner Kustomizations a
  # patch that drops ImagePolicy/ImageUpdateAutomation (their ImageRepository
  # lives in the excluded image-automation Kustomization; with wait: true they
  # would keep the apps NotReady forever).
  - target: { kind: Kustomization, name: apps-(develop|staging|production) }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: ResourceSetInputProvider }
            patch: |-
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata: { name: placeholder }
              $patch: delete
          - target: { kind: Kustomization }
            patch: |-
              - op: add
                path: /spec/patches
                value:
                  - target: { kind: ImagePolicy }
                    patch: |-
                      apiVersion: image.toolkit.fluxcd.io/v1
                      kind: ImagePolicy
                      metadata: { name: placeholder }
                      $patch: delete
                  - target: { kind: ImageUpdateAutomation }
                    patch: |-
                      apiVersion: image.toolkit.fluxcd.io/v1
                      kind: ImageUpdateAutomation
                      metadata: { name: placeholder }
                      $patch: delete
          # kind has no secrets-<env> (Terraform creates the backend's Secrets): the backend waits only
          # for what kind runs.
          - target: { kind: Kustomization, name: "backend-(develop|staging|production)" }
            patch: |-
              - op: replace
                path: /spec/dependsOn
                value:
                  - name: flux-system
                  - name: observability
