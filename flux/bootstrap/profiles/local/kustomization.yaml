# Local (kind) profile.
#
# Same GitOps tree as production, minus everything that needs a cloud account,
# a DNS zone, an LLM key or the author's SOPS key. What is removed:
#   - cert-manager, dns-and-certificates, dex, headlamp              (Cloudflare DNS, OIDC sign-in)
#   - opentelemetry-collector                                        (Uptrace DSN)
#   - image-automation                                                (needs git write token)
#   - secrets-*                                                       (encrypted for the platform key)
# What is added:
#   - minio          S3-compatible target for CNPG backups instead of Hetzner Object Storage
#   - secrets-local  the learner's own SOPS-encrypted secrets (secrets chapter)
#   - lab            scratch namespace with Pod Security warn/audit (admission-policy drills)
# What stays although nobody signs in through OIDC here: oidc-rbac - the roles of the GitHub teams and
# the policy on Flux fields. They need no Dex; `kubectl --as=<user> --as-group=safeops-course:members`
# shows what a person in that team may do (Chapter 21).
# Runtime secrets the apps need (JWT, Postgres owner, MinIO creds, sops-age)
# are created by infra/terraform/kind_cluster at cluster creation.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../flux-system
  - minio.yaml
  - secrets-local.yaml
  - lab.yaml
  - alerting-routing.yaml
patches:
  # Point the self-managing Kustomization at this profile, not at the base.
  - target: { kind: Kustomization, name: flux-system }
    patch: |-
      - op: replace
        path: /spec/path
        value: ./flux/bootstrap/profiles/local

  # --- remove cloud-only Kustomizations -------------------------------------
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: image-automation, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: cert-manager, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: dns-and-certificates, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: origin-ca-issuer-crds, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: origin-ca-issuer, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata: { name: origin-ca-issuer, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: dex, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: headlamp, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: opentelemetry-collector, namespace: flux-system }
      $patch: delete
  # The Guardian (k8s-ai-monitor, Chapter 14) runs on kind too. Its Secret comes from Terraform
  # (guardian_llm_provider / guardian_llm_api_key), not from secrets-observability; and kind has no
  # image automation, so its ImagePolicy and ImageUpdateAutomation are left out - the tag changes
  # only by a commit, as for every app on kind (Chapter 10). LLM_DEBUG is on, for the lab.
  - target: { kind: Kustomization, name: k8s-ai-monitor }
    patch: |-
      - op: replace
        path: /spec/dependsOn
        value:
          - name: observability-resources
      - op: add
        path: /spec/patches
        value:
          - patch: |-
              apiVersion: image.toolkit.fluxcd.io/v1
              kind: ImagePolicy
              metadata: { name: k8s-ai-monitor, namespace: observability }
              $patch: delete
          - patch: |-
              apiVersion: image.toolkit.fluxcd.io/v1
              kind: ImageUpdateAutomation
              metadata: { name: k8s-ai-monitor, namespace: observability }
              $patch: delete
          # Keep every LLM request and response (GET /llm-debug, 7 days): on kind you see
          # exactly what left the cluster, already redacted (Chapter 14).
          - patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata: { name: k8s-ai-monitor }   # no namespace: deployment.yaml has none yet
              spec:
                template:
                  spec:
                    containers:
                      - name: k8s-ai-monitor
                        env:
                          - name: LLM_DEBUG
                            value: "true"
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: alerting, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-auth, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-flux-system, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-cloudflare, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-observability, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-develop, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-staging, namespace: flux-system }
      $patch: delete
  - patch: |-
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata: { name: secrets-production, namespace: flux-system }
      $patch: delete

  # --- observability no longer waits for cert-manager -----------------------
  - target: { kind: Kustomization, name: observability }
    patch: |-
      - op: replace
        path: /spec/dependsOn
        value:
          - name: infrastructure

  # --- CNPG clusters: wait for MinIO ---------------------------------------
  # Endpoint, bucket and keys point at MinIO already: Terraform writes them
  # (ConfigMap flux-system/backup-s3, Secret cnpg-backup-s3).
  - target: { kind: Kustomization, name: cnpg-cluster-develop }
    patch: |-
      - op: replace
        path: /spec/dependsOn
        value:
          - name: cnpg-operator
          - name: network-policies-develop
          - name: resource-management-develop
          - name: minio
  - target: { kind: Kustomization, name: cnpg-cluster-staging }
    patch: |-
      - op: replace
        path: /spec/dependsOn
        value:
          - name: cnpg-operator
          - name: network-policies-staging
          - name: resource-management-staging
          - name: minio
  - target: { kind: Kustomization, name: cnpg-cluster-production }
    patch: |-
      - op: replace
        path: /spec/dependsOn
        value:
          - name: cnpg-operator
          - name: network-policies-production
          - name: resource-management-production
          - name: minio

  # --- apps: no image automation locally -----------------------------------
  # apps-<env> renders flux/bootstrap/apps/<env>, which creates the
  # backend-<env>/frontend-<env> Kustomizations and a ResourceSetInputProvider
  # that scans GHCR. Drop the provider, and give the inner Kustomizations a
  # patch that drops ImagePolicy/ImageUpdateAutomation (their ImageRepository
  # lives in the excluded image-automation Kustomization; with wait: true they
  # would keep the apps NotReady forever).
  - target: { kind: Kustomization, name: apps-(develop|staging|production) }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: ResourceSetInputProvider }
            patch: |-
              apiVersion: fluxcd.controlplane.io/v1
              kind: ResourceSetInputProvider
              metadata: { name: placeholder }
              $patch: delete
          - target: { kind: Kustomization }
            patch: |-
              - op: add
                path: /spec/patches
                value:
                  - target: { kind: ImagePolicy }
                    patch: |-
                      apiVersion: image.toolkit.fluxcd.io/v1
                      kind: ImagePolicy
                      metadata: { name: placeholder }
                      $patch: delete
                  - target: { kind: ImageUpdateAutomation }
                    patch: |-
                      apiVersion: image.toolkit.fluxcd.io/v1
                      kind: ImageUpdateAutomation
                      metadata: { name: placeholder }
                      $patch: delete
