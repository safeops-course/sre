# DOKS profile: the full platform on the DOKS cluster (infra/terraform/doks_cluster) - the same as on
# Hetzner, GKE, EKS and AKS. Clusters of different providers never run at the same time: they share the DNS
# names (each provider has its own external-dns owner ID, from cluster-config cloud_provider, so the first
# one keeps them) and image automation writes to the same branch.
#
#   base         flux/bootstrap/flux-system - what every cluster runs
#   components   every one, as on the other clouds
#   patches      Traefik's LoadBalancer Service gets a regional load balancer with IPv4 and IPv6 (below).
#                The cluster itself is IPv4 only - the written exception of docs/providers.md, from
#                cluster-config service_ip_family_policy, not from here
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../flux-system
components:
  - ../../components/platform-secrets
  - ../../components/public-edge
  - ../../components/image-automation
  - ../../components/alerting
  - ../../components/opentelemetry
patches:
  # Point the self-managing Kustomization at this profile.
  - target: { kind: Kustomization, name: flux-system }
    patch: |-
      - op: replace
        path: /spec/path
        value: ./flux/bootstrap/profiles/doks

  # --- Traefik: a dual-stack regional load balancer --------------------------------
  # DigitalOcean's cloud controller makes a load balancer for the Service. Its default type
  # (REGIONAL_NETWORK) is dual-stack only when every node has IPv6, which DOKS nodes never have - so IPv4
  # only. REGIONAL is: it terminates the connections and opens new ones to the nodes over IPv4, so the
  # public side gets an IPv4 and an IPv6 address. network-stack DUALSTACK says so explicitly - the
  # controller refuses the Service rather than quietly giving it IPv4 only. Protocol tcp (the default):
  # TLS stays end to end to Traefik. The name tells the load balancer apart in the account (make leftovers).
  # https://github.com/digitalocean/digitalocean-cloud-controller-manager/blob/master/docs/controllers/services/annotations.md
  - target: { kind: Kustomization, name: traefik }
    patch: |-
      - op: add
        path: /spec/patches
        value:
          - target: { kind: HelmRelease, name: traefik }
            patch: |-
              - op: add
                path: /spec/values/service/annotations
                value:
                  service.beta.kubernetes.io/do-loadbalancer-type: REGIONAL
                  service.beta.kubernetes.io/do-loadbalancer-network-stack: DUALSTACK
                  service.beta.kubernetes.io/do-loadbalancer-name: ${cluster_name}-doks-traefik
