apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.146.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 12h
  targetNamespace: observability
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset

    image:
      repository: otel/opentelemetry-collector-contrib

    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
      kubernetesAttributes:
        enabled: true

    extraEnvs:
      - name: UPTRACE_DSN
        valueFrom:
          secretKeyRef:
            name: uptrace-secrets
            key: dsn
            optional: true
      - name: DEPLOYMENT_ENVIRONMENT
        value: "development"
      - name: K8S_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace

    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null

      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 512
          spike_limit_mib: 128
        batch:
          send_batch_size: 1000
          timeout: 10s
        resource:
          attributes:
            - key: deployment.environment
              value: ${env:DEPLOYMENT_ENVIRONMENT}
              action: upsert
            - key: service.namespace
              value: ${env:K8S_NAMESPACE}
              action: upsert
        attributes:
          actions:
            - key: uptrace.dsn
              action: delete

      exporters:
        otlp/uptrace:
          endpoint: api.uptrace.dev:4317
          headers:
            uptrace-dsn: ${env:UPTRACE_DSN}
          compression: gzip
          retry_on_failure:
            enabled: true
            initial_interval: 10s
            max_interval: 300s
            max_elapsed_time: 0
          sending_queue:
            enabled: true
            num_consumers: 2
            queue_size: 100
        debug:
          verbosity: basic
          sampling_initial: 5
          sampling_thereafter: 200

      service:
        pipelines:
          logs:
            receivers: [filelog]
            processors: [memory_limiter, batch, resource, attributes]
            exporters: [otlp/uptrace, debug]
          traces: null
          metrics: null

    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
