apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-collector
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: opentelemetry-collector
      version: "0.175.1"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
      interval: 12h
  targetNamespace: observability
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset

    image:
      repository: otel/opentelemetry-collector-contrib

    # logsCollection: stdout/stderr of every container on the node (/var/log/pods), every namespace,
    # kube-system included. Not here: services outside pods (kubelet, containerd, k3s - the control plane
    # on k3s - write to journald) and Kubernetes Events (release-events.yaml).
    # storeCheckpoints: the read position of each file is kept on the node (/var/lib/otelcol, hostPath),
    # so a restarted collector goes on where it stopped; without it, it starts at the end of every file
    # and the lines written while it was down are lost. The chart then runs the collector as root: the
    # hostPath directory is root-owned (default capabilities - nothing added).
    presets:
      logsCollection:
        enabled: true
        includeCollectorLogs: false
        storeCheckpoints: true
      kubernetesAttributes:
        enabled: true
    # Kubelet metrics come from kubelet_stats below, not from the kubeletMetrics preset: the preset (chart
    # 0.175.1) still names the receiver "kubeletstats", a deprecated alias the collector warns about on
    # every start. What the preset added besides the receiver - read access to nodes/stats - is here.
    clusterRole:
      rules:
        - apiGroups: [""]
          resources: ["nodes/stats"]
          verbs: ["get", "watch", "list"]

    extraEnvs:
      - name: UPTRACE_DSN
        value: "${uptrace_dsn}"
      - name: DEPLOYMENT_ENVIRONMENT
        value: "${cluster_name}"
      - name: K8S_CLUSTER_NAME
        value: "${cluster_name}"

    config:
      receivers:
        jaeger: null
        zipkin: null
        prometheus: null
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        kubelet_stats:
          collection_interval: 20s
          auth_type: serviceAccount
          endpoint: $${env:K8S_NODE_IP}:10250
          insecure_skip_verify: true

      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 512
          spike_limit_mib: 128
        batch:
          send_batch_size: 10000
          timeout: 10s
        cumulative_to_delta: {}
        resource:
          attributes:
            - key: deployment.environment
              value: $${env:DEPLOYMENT_ENVIRONMENT}
              action: upsert
            - key: k8s.cluster.name
              value: $${env:K8S_CLUSTER_NAME}
              action: upsert
        attributes:
          actions:
            - key: uptrace.dsn
              action: delete

      exporters:
        otlp_http/uptrace:
          endpoint: https://api.uptrace.dev
          headers:
            uptrace-dsn: $${env:UPTRACE_DSN}
          compression: gzip
          retry_on_failure:
            enabled: true
            initial_interval: 10s
            max_interval: 300s
            max_elapsed_time: 0
          # The queue is kept on the node too (file_storage - the extension storeCheckpoints adds), so the
          # batches waiting for Uptrace survive a restart: a file position is saved once a line is read,
          # not once it is sent.
          sending_queue:
            enabled: true
            num_consumers: 2
            queue_size: 100
            storage: file_storage
        debug:
          verbosity: basic
          sampling_initial: 5
          sampling_thereafter: 200

      service:
        # The chart's default names the collector's own resource in the old inline-map form, which the
        # collector warns about on every start; each old key is removed (null) and the same attributes are
        # given as the list it expects.
        telemetry:
          resource:
            host.name: null
            k8s.namespace.name: null
            k8s.node.ip: null
            k8s.node.name: null
            k8s.pod.ip: null
            k8s.pod.name: null
            attributes:
              - { name: host.name, value: "$${env:OTEL_K8S_NODE_NAME}" }
              - { name: k8s.namespace.name, value: "$${env:OTEL_K8S_NAMESPACE}" }
              - { name: k8s.node.ip, value: "$${env:OTEL_K8S_NODE_IP}" }
              - { name: k8s.node.name, value: "$${env:OTEL_K8S_NODE_NAME}" }
              - { name: k8s.pod.ip, value: "$${env:OTEL_K8S_POD_IP}" }
              - { name: k8s.pod.name, value: "$${env:OTEL_K8S_POD_NAME}" }
        pipelines:
          logs:
            receivers: [file_log]
            processors: [memory_limiter, batch, resource, attributes]
            exporters: [otlp_http/uptrace, debug]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch, resource, attributes]
            exporters: [otlp_http/uptrace, debug]
          metrics:
            receivers: [otlp, kubelet_stats]
            processors: [memory_limiter, cumulative_to_delta, batch, resource]
            exporters: [otlp_http/uptrace, debug]

    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 512Mi

    tolerations:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
