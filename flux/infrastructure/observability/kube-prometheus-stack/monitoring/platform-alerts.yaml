# Alerts about the platform itself - the components that run the applications, not the applications.
# Both come from 2026-10-08 (kind): Kyverno's reports controller re-verified every running image,
# averaged 1.3 cores (6.6 at peak) and restarted 49 times in 29 hours - and nothing in Prometheus
# said so. Each restart exited 0 (it lost its leader lease under its own load), so
# KubePodCrashLooping - which waits for CrashLoopBackOff - stayed silent.
# tests/platform-alerts.test.sh runs these rules against made-up series with promtool.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  # The labels of the other rule files (Prometheus loads every PrometheusRule - ruleSelector: {} -
  # so they select nothing; they keep the files alike for anyone filtering by them).
  labels:
    prometheus: kube-prometheus-stack
    role: alert-rules
spec:
  groups:
    - name: platform
      rules:
        # Restarts by count, whatever the exit code: a container that restarts four times an hour is
        # not healthy, even when every exit looks clean. floor(): increase() extrapolates to the edges
        # of the window, so exactly three restarts can come out as 3.1 - restarts are whole numbers.
        - alert: ContainerRestartingOften
          expr: floor(increase(kube_pod_container_status_restarts_total[1h])) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $value | humanize }} times in the last hour"
            description: >-
              A restart loop can look clean: each exit 0, the pod Running between restarts.
              kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous
              shows why the last run ended; kubectl describe pod shows the last state's reason.

        # A platform component that keeps half a core busy for half an hour is doing work nobody
        # asked for - a scan, a loop, a rule that never finishes. The application namespaces are not
        # listed: their resources have their own budgets (scripts/check-app-resources.sh).
        - alert: PlatformComponentHighCPU
          expr: |
            sum by (namespace, pod) (
              rate(container_cpu_usage_seconds_total{
                namespace=~"kube-system|flux-system|kyverno|observability|flagger-system|cnpg-system|traefik|cert-manager|external-dns|auth|minio",
                container!="", container!="POD"
              }[15m])
            ) > 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: '{{ $labels.namespace }}/{{ $labels.pod }} has used {{ $value | printf "%.2f" }} CPU cores for 30 minutes'
            description: >-
              Find what it is doing before giving it more: its logs, its own metrics, what changed
              in its configuration. Scaling a component that loops only makes the loop bigger.

        # A node left cordoned. Maintenance (scripts/node-maintenance.sh) uncordons within minutes; a
        # k3s upgrade whose drain is refused by a PodDisruptionBudget retries forever and leaves the
        # node cordoned - seen on Hetzner in 2026-10 with nothing alerting (Chapter 20). New pods
        # cannot land there, and with one worker nothing new can start at all.
        - alert: NodeCordonedTooLong
          expr: kube_node_spec_unschedulable == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Node {{ $labels.node }} has been cordoned for more than 30 minutes"
            description: >-
              A maintenance or an upgrade did not finish. kubectl get plans.upgrade.cattle.io -n
              system-upgrade and the upgrade job's log ("Cannot evict pod") for a k3s upgrade; the
              node-maintenance run's output otherwise. kubectl uncordon {{ $labels.node }} once the
              node is healthy.
