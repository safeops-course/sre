---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  # The chart's CRDs (prometheus-operator) are in its crds/ directory, which Helm installs once and never
  # upgrades. A major version of this chart usually brings a new operator that needs its new CRDs
  # (UPGRADE.md: "update the CRDs before applying the upgrade"). CreateReplace makes Flux apply them on
  # every install and upgrade - the CRDs move with the chart, in the same pull request.
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: observability
      interval: 12h
  values:
    # Prometheus configuration
    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: "10GB"
        # Memory: it used 401Mi at rest on kind (2026-10-21) - 80 % of the old 512Mi limit, with more
        # targets on a cloud cluster. CPU stays 100m (11m at rest): it evaluates the alert rules, which
        # already ran short of CPU once (sre#132).
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        # Select every ServiceMonitor, PodMonitor and PrometheusRule in every namespace.
        # The *NilUsesHelmValues: false lines are what makes the empty selectors mean "all": with the
        # chart default (true) an empty selector silently becomes release=kube-prometheus-stack, and
        # our own backend ServiceMonitors and PrometheusRules were never scraped or loaded.
        serviceMonitorSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        ruleSelector: {}
        ruleNamespaceSelector: {}

    # Grafana configuration
    grafana:
      enabled: true
      adminPassword: admin
      initChownData:
        enabled: false
      securityContext:
        fsGroup: 472
      persistence:
        enabled: true
        size: 5Gi
      # One ReadWriteOnce volume holds Grafana's SQLite database. A rolling update starts the new Grafana
      # next to the old one on the same database: on the 12 -> 13 upgrade the new one migrated it while
      # the old one still served from it, and both failed. maxSurge 0 stops the old pod first - a short
      # gap in the dashboards instead of two writers on one database. (type: Recreate does the same, but
      # switching an existing Deployment to it fails under Helm's server-side apply: the API server's
      # defaulted rollingUpdate block stays and "may not be specified when strategy type is Recreate".)
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      # Grafana 13 registers its API groups and runs storage migrations at start: at a 100m limit it took
      # over the liveness probe's 160 s and was restarted in a loop, and it uses ~230Mi once up (measured
      # on kind; 218Mi on 2026-10-21). The CPU limit is for the start; at rest it uses little.
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 512Mi
      # The two sidecars that load dashboards and datasources requested nothing; they use ~80Mi each.
      sidecar:
        resources:
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            memory: 192Mi
      # Default dashboards
      defaultDashboardsEnabled: true
      defaultDashboardsTimezone: UTC
      # Grafana is accessed via kubectl port-forward
      ingress:
        enabled: false

    # Alertmanager: the path from a firing alert to a human. The chart's default config sends
    # everything to the "null" receiver (so kind stays quiet); receivers are added per cluster with
    # AlertmanagerConfig objects labelled alertmanagerconfig: safeops - on the platform:
    # flux/infrastructure/observability/alerting (Watchdog -> Healthchecks.io dead man's switch).
    alertmanager:
      enabled: true
      alertmanagerSpec:
        replicas: 1
        retention: 24h
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        alertmanagerConfigSelector:
          matchLabels:
            alertmanagerconfig: safeops
        # Without this the operator adds a namespace="observability" matcher to every
        # AlertmanagerConfig route - and Watchdog has no namespace label, so it would never match.
        alertmanagerConfigMatcherStrategy:
          type: None

    # Prometheus Operator configuration
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi

    # Control-plane components neither cluster lets Prometheus scrape: kind binds etcd, the scheduler,
    # the controller manager and kube-proxy to localhost, and k3s (Hetzner) runs them inside one binary.
    # Scraping them only produced TargetDown and etcd alerts that fired at rest - noise that teaches
    # people to ignore alerts. Their health shows through the API server and the nodes.
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false

    # The API server is the biggest source of series: its histograms are split by verb x resource x
    # scope, 20-40 buckets each - about 23,000 series on kind, more than every other job together.
    # Only two of them are read by a rule or a dashboard (checked against /api/v1/rules and the
    # grafana_dashboard ConfigMaps): apiserver_request_sli_duration_seconds_bucket (the availability
    # and histogram recording rules behind the API server dashboard) and
    # apiserver_client_certificate_expiration_seconds_bucket (KubeClientCertificateExpiration).
    # The rest are dropped at ingestion. The list replaces the chart's default, so its first entry -
    # the chart's own drop of the noisiest buckets - is copied here unchanged.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
          - action: drop
            regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
            sourceLabels: [__name__, le]
          - action: drop
            regex: (etcd_.+|apiserver_(admission|cel|delegated|flowcontrol|impersonation|storage|validating_admission_policy|watch)_.+|apiserver_(request_body_size_bytes|request_duration_seconds|request_filter_duration_seconds|request_slo_duration_seconds|request_timestamp_comparison_time|response_sizes))_bucket
            sourceLabels: [__name__]

    # Default rules: every alert must call for an action. The rules for the components above go with
    # them; KubeHpaMaxedOut fires for every HPA whose min equals its max - develop and staging run
    # that way on purpose (Chapter 09), so it would fire forever and mean nothing.
    defaultRules:
      rules:
        etcd: false
        kubeControllerManager: false
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        # The API server's own error-budget SLO (KubeAPIErrorBudgetBurn): burn rates over windows up
        # to 3 days across thousands of histogram series. One evaluation took 95 s against a 30 s
        # interval - it missed 50 of every 60 runs and kept Prometheus busy without a pause - for an
        # alert about the control plane, which kind runs for us and k3s manages on Hetzner. The
        # course's SLOs are the applications' (Chapter 11). Availability and histogram rules stay:
        # the API server dashboard reads them.
        kubeApiserverBurnrate: false
        kubeApiserverSlos: false
      disabled:
        KubeHpaMaxedOut: true

    # Node exporter - collect node metrics
    nodeExporter:
      enabled: true

    # Kube-state-metrics - collect Kubernetes object metrics
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    # Additional scrape configs
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
