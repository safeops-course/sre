---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: k8s-ai-monitor
  namespace: observability
spec:
  imageRepositoryRef:
    name: k8s-ai-monitor
    namespace: flux-system
  filterTags:
    pattern: '^main-v[0-9]+\.[0-9]+\.[0-9]+-[a-f0-9]+-(?P<ts>[0-9]+)$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
