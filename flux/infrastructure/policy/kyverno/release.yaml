apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: "3.9.1"   # Kyverno 1.19.1 - tests/tool-versions.test.sh checks the CLI in CI is the same
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 12h
  targetNamespace: kyverno
  # How long Helm waits for every Kyverno pod to be Ready before it calls an install or upgrade failed
  # (and Flux rolls back). The default 5 minutes was too short on a slow network: the 3.9.1 upgrade
  # pulled each image for about 2 minutes, timed out, was rolled back, and only the retry - with the
  # images already on the node - went through (kind, 2026-10-10).
  timeout: 15m
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      # Namespaces the admission webhooks never see. The webhooks fail closed (failurePolicy: Fail):
      # while no Kyverno replica answers, the API server refuses every Pod they cover. flux-system
      # is out so that the path that repairs Kyverno - Flux applying Git - never waits on Kyverno.
      # Its pods are still scanned in the background and reported in PolicyReports.
      # kube-system is the chart's default; the kyverno namespace is excluded by the chart itself.
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kube-system
                - flux-system
    features:
      # PolicyExceptions (Chapter 16) - read only from this one namespace. The namespace and its
      # exceptions come from Git (flux/infrastructure/policy/exceptions); the ValidatingAdmissionPolicy
      # there lets only Flux write them.
      policyExceptions:
        enabled: true
        namespace: policy-exceptions
      # Credentials for reading images and signatures. The chart's default adds the google, amazon,
      # azure and github helpers, which look for each cloud's credentials on registry reads. The
      # platform's images are public on ghcr.io and need none, so only the default keychain: nothing
      # to look up, on every provider alike.
      registryClient:
        credentialHelpers:
          - default
    # Requests: the chart's 100m CPU per controller (500m for the five pods) against 3-5m used at rest
    # (kind 2026-10-21). 20-25m is the scheduling floor; there is no CPU limit, so a background scan
    # still takes what it needs (it took 6.6 cores once - sre#131). Memory: what each uses plus room; the
    # reports controller used 84Mi of the chart's 128Mi limit.
    admissionController:
      replicas: 2
      container:
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 384Mi
      # One admission controller always answers through a node drain. The chart creates this budget
      # by itself whenever replicas > 1; written out here so it does not hang on that rule.
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      # ...and the two must be on different nodes for that. With one worker and a tainted control
      # plane both ran on the worker: its reboot took both down, the fail-closed signature webhook
      # refused every new app pod, and the ReplicaSets' retry backoff kept production down 18 minutes
      # for a 5-minute reboot (Hetzner cycle 2026-10-12). So the admission controller may run on the
      # control plane, and must be spread one per node: the chart's own anti-affinity is only a
      # preference, and on kind both replicas then went to the control plane. A spread, not a required
      # anti-affinity: with two nodes a rolling update can still place its new pod (skew 1). Only the
      # admission controller: the other Kyverno controllers can wait for the worker.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:          # a spread counts pods in the kyverno namespace only
            matchLabels:
              app.kubernetes.io/component: admission-controller
          # Count only this revision's pods: during a rolling update the old ones still occupy the
          # worker, and both new ones landed on the control plane (seen on kind).
          matchLabelKeys:
            - pod-template-hash
    backgroundController:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    cleanupController:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 128Mi
    reportsController:
      enabled: true
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi
      # The admission guardrails (Chapter 16) also match pods/ephemeralcontainers - kubectl debug
      # writes there - and Kyverno marks a policy "not ready for reporting" until this controller may
      # read every resource the policy matches (RBACPermissionsGranted=False, seen on kind with
      # 1.19.1). Read-only; the pod spec it returns is the one the controller already reads.
      rbac:
        clusterRole:
          extraResources:
            - apiGroups: [""]
              resources: [pods/ephemeralcontainers]
              verbs: [get, list, watch]
