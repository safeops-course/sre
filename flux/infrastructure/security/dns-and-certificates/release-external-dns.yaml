---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  # Own namespace and a plain release name; before, it ran as cert-manager/cert-manager-external-dns.
  targetNamespace: external-dns
  releaseName: external-dns
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
      - --annotation-filter=cloudflare-proxied=enabled
      - --cloudflare-proxied
      - --kube-api-request-timeout=60s
      - --cloudflare-dns-records-per-page=500
    # A and AAAA: a dual-stack load balancer has an IPv6 address too, and its record is published like the
    # IPv4 one (the default list today - named here, so a default change cannot drop IPv6).
    managedRecordTypes: [A, AAAA, CNAME]
    domainFilters:
      - safeops.work
    policy: sync
    sources:
      - ingress
    # Each cloud profile adds its provider (k8s-external-dns-sre-gke, -hetzner): one owner per provider,
    # so two clusters never rewrite each other's records. A new provider adds the same patch.
    txtOwnerId: "k8s-external-dns-${cluster_name}"
