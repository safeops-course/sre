---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  # Own namespace and a plain release name; before, it ran as cert-manager/cert-manager-external-dns.
  targetNamespace: external-dns
  releaseName: external-dns
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token
    extraArgs:
      - --annotation-filter=cloudflare-proxied=enabled
      - --cloudflare-proxied
      - --kube-api-request-timeout=60s
      - --cloudflare-dns-records-per-page=500
    # A and AAAA: a dual-stack load balancer has an IPv6 address too, and its record is published like the
    # IPv4 one (the default list today - named here, so a default change cannot drop IPv6).
    managedRecordTypes: [A, AAAA, CNAME]
    domainFilters:
      - safeops.work
    policy: sync
    sources:
      - ingress
    # external-dns changes only records with its own owner ID (a TXT record next to each). One per
    # provider (cluster-config cloud_provider, written by each Terraform module): cluster_name is "sre"
    # everywhere, and two clusters with one ID rewrote each other's records every minute (Hetzner + GKE,
    # 2026-10-16). A record another owner left is skipped - flux-pre-destroy.sh removes the Ingresses
    # and waits for external-dns to delete their records before a cluster goes.
    txtOwnerId: "k8s-external-dns-${cluster_name}-${cloud_provider}"
