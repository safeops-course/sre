---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.28.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 30m
  targetNamespace: auth
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      oidc:
        clientID: headlamp
        clientSecret: ""
        issuerURL: https://dex.safeops.work
        scopes: "openid,profile,email,groups"
    env:
      - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: dex-secrets
            key: DEX_HEADLAMP_CLIENT_SECRET
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
        # external-dns only publishes Ingresses that opt in (--annotation-filter=cloudflare-proxied=enabled)
        cloudflare-proxied: "enabled"
      hosts:
        - host: headlamp.safeops.work
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: headlamp-tls
          hosts:
            - headlamp.safeops.work
