---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: "0.45.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 30m
  targetNamespace: auth
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      oidc:
        clientID: headlamp
        clientSecret: ""
        issuerURL: https://dex.safeops.work
        scopes: "openid,profile,email,groups"
    # The client secret comes from dex-secrets (single source, shared with Dex). Headlamp reads
    # HEADLAMP_CONFIG_OIDC_CLIENT_SECRET itself; env[].valueFrom needs chart >= 0.29 (0.28.0's
    # values schema rejected it and the install failed).
    env:
      - name: HEADLAMP_CONFIG_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: dex-secrets
            key: DEX_HEADLAMP_CLIENT_SECRET
    ingress:
      enabled: true
      ingressClassName: traefik
      annotations:
        cert-manager.io/issuer: cloudflare-origin-ca
        cert-manager.io/issuer-kind: ClusterOriginIssuer
        cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
        # external-dns only publishes Ingresses that opt in (--annotation-filter=cloudflare-proxied=enabled)
        cloudflare-proxied: "enabled"
      hosts:
        - host: headlamp.safeops.work
          paths:
            - path: /
              type: Prefix
      tls:
        - secretName: headlamp-tls
          hosts:
            - headlamp.safeops.work
    # The chart requests nothing: the pod is BestEffort, so any memory it uses is over its request, and
    # such pods are the first the kubelet evicts when a node runs short. The request is what Headlamp uses
    # at rest plus room (EKS 2026-10-21: 1m, 11Mi); the memory limit catches a leak.
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
