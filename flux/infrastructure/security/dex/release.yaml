---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: dex
      version: "0.26.0"
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: flux-system
      interval: 30m
  targetNamespace: auth
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    config:
      issuer: https://dex.safeops.work
      storage:
        type: kubernetes
        config:
          inCluster: true
      web:
        # ":5556" = every address of both families (Go); 0.0.0.0 was IPv4 only - a dual-stack pod is
        # also reached over IPv6.
        http: ":5556"
      connectors:
        - type: github
          id: github
          name: GitHub
          config:
            clientID: $DEX_GITHUB_CLIENT_ID
            clientSecret: $DEX_GITHUB_CLIENT_SECRET
            redirectURI: https://dex.safeops.work/callback
            # Dex puts only "org:team" into the groups claim, never the bare org, so RBAC binds
            # safeops-course:members and safeops-course:admins. Listing the teams also limits the
            # login to their members (fail closed); anyone else in the org is refused.
            orgs:
              - name: safeops-course
                teams:
                  - members
                  - admins
            teamNameField: slug
      oauth2:
        skipApprovalScreen: true
      # How fast taking access away works. The API server trusts an ID token until it expires - it
      # cannot be revoked. Dex's default is 24h: someone removed from the GitHub team kept kubectl
      # access for up to a day. With 1h, kubelogin refreshes every hour, and on refresh Dex reads the
      # person's teams from GitHub again (connector/github Refresh): out of the team, no group, no
      # role. Removal takes effect within an hour (Chapter 21) - for tokens issued after this setting
      # is applied: a token issued before keeps the 24h it was signed with. The Hetzner cluster is
      # rebuilt each cycle, so a new cluster starts with 1h tokens; on a cluster that lives on, the
      # rule holds 24h after the change.
      expiry:
        idTokens: 1h
      staticClients:
        - id: headlamp
          name: Headlamp
          redirectURIs:
            - https://headlamp.safeops.work/oidc-callback
          secretEnv: DEX_HEADLAMP_CLIENT_SECRET
        # The kubectl client (kubelogin) is public: no secret, PKCE instead. A secret copied to every
        # laptop is not a secret, and Dex compares it even for public clients - with secretEnv set,
        # "kubectl oidc-login" without the secret fails with invalid_client (Hetzner cycle 2026-09-27).
        - id: kubernetes
          name: Kubernetes
          redirectURIs:
            - http://localhost:8000
            - http://localhost:18000
          public: true
    envFrom:
      - secretRef:
          name: dex-secrets
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/issuer: cloudflare-origin-ca
        cert-manager.io/issuer-kind: ClusterOriginIssuer
        cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
        # external-dns only publishes Ingresses that opt in (--annotation-filter=cloudflare-proxied=enabled)
        cloudflare-proxied: "enabled"
      hosts:
        - host: dex.safeops.work
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: dex-tls
          hosts:
            - dex.safeops.work
