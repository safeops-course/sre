---
# Cloudflare Origin CA Issuer: a cert-manager issuer that gets origin certificates from Cloudflare's
# Origin CA. Behind the Cloudflare proxy (all our records are proxied) visitors see Cloudflare's edge
# certificate; the origin certificate only has to be trusted by Cloudflare - which it is in
# "Full (strict)" mode. No ACME, no Let's Encrypt rate limits, however often the cluster is rebuilt.
# The CRDs are not in the chart; they come from the upstream repo at the same release
# (Kustomization origin-ca-issuer-crds).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: origin-ca-issuer
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: cert-manager
  releaseName: origin-ca-issuer
  chart:
    spec:
      chart: origin-ca-issuer
      version: "0.6.10" # app v0.15.0 - keep in step with the CRD commit in the bootstrap
      sourceRef:
        kind: HelmRepository
        name: origin-ca-issuer
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart binds "approve" on the Origin CA signers to this ServiceAccount. Ours is named after
    # the HelmRelease (cert-manager-cert-manager), not the chart default "cert-manager" - with the
    # default, cert-manager's webhook refuses to approve every CertificateRequest and no origin
    # certificate is ever issued (found on the Hetzner cycle 2026-09-27).
    certmanager:
      namespace: cert-manager
      serviceAccountName: cert-manager-cert-manager
    controller:
      # ClusterOriginIssuer tokens are read from this namespace (flux/secrets/cloudflare).
      clusterResourceNamespace: cert-manager
      # The chart requests a whole core and 512Mi (requests = limits); it used 1m and 15Mi on EKS
      # (2026-10-21) - and its 1000m filled a 2 vCPU node, leaving the OTel agent DaemonSet Pending.
      # What it uses plus room; the memory limit catches a leak.
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
