# Traefik, the ingress of every cluster - installed by Flux, not by the cluster's Terraform, so each
# provider gets the same ingress and its Terraform module stays "a cluster + Flux". What differs per
# cluster is only how the Service is reached, and that is the profile's patch, not this file:
#   - here (the base): a LoadBalancer Service with an HTTPS redirect, no provider annotations.
#   - Hetzner (profiles/hetzner): the annotations that make it take over the load balancer
#     kube-hetzner creates and deletes, and the PROXY protocol from it.
#   - kind (profiles/local): a NodePort Service on 30080/30443, which kind's port mappings publish as
#     localhost:8080/8443.
# The Hetzner values are the ones kube-hetzner 3.2.1 set itself (its traefik_values_default), so the
# move to Flux changed who installs Traefik, not how it behaves.
# The chart publishes the Service's address in each Ingress status (publishedService, on by default) -
# external-dns makes the DNS records from it.
# releaseName: the Service stays traefik/traefik - Ingress status, external-dns and the PodMonitor
# (observability/traefik) use that name; the network policies admit the namespace traefik.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: "41.7.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 30m
  targetNamespace: traefik
  install:
    createNamespace: false
    # The chart carries Traefik's CRDs (IngressRoute, Middleware - Flagger's canary uses them):
    # keep them in step with the chart on upgrades too (Helm alone never upgrades CRDs).
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 1
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 33%
    resources:
      requests:
        cpu: 100m
        memory: 50Mi
      limits:
        cpu: 300m
        memory: 150Mi
    # service.spec.type stays the chart's default, LoadBalancer; its annotations come from the profile.
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
