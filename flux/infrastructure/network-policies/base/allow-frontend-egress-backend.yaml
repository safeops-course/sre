apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-backend
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [frontend, frontend-primary]
  policyTypes:
    - Egress
  egress:
    - to:
        # Flagger relabels the primary pods app=backend-primary and points the
        # Service at them; without it the frontend cannot reach the backend in
        # any namespace with a Canary.
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [backend, backend-primary]
      ports:
        - protocol: TCP
          port: 8080
