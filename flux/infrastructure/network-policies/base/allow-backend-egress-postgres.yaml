apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-postgres
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend]
  policyTypes:
    - Egress
  egress:
    - to:
        # app-postgres-restore: lets a validation pod with the backend's label check a restore.
        - podSelector:
            matchExpressions:
              - key: cnpg.io/cluster
                operator: In
                values: [app-postgres-rw]
      ports:
        - protocol: TCP
          port: 5432
