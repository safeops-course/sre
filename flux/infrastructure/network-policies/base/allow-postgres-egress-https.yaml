# Postgres (CNPG) may open HTTPS to the internet: its backups and WAL archive go to S3-compatible object
# storage (the Barman Cloud plugin's sidecar in the pod; BACKUP_S3_ENDPOINT - outside the cluster, an address that
# is not a pod).
# Trade-off: the ipBlock allows any address on TCP 443, not only the backup endpoint - NetworkPolicy
# cannot select a host name. The residual risk: a compromised database pod could send data to any
# HTTPS host. Narrow it to the endpoint's address range if the provider publishes a stable one.
# IPv6 too (::/0): an ipBlock covers one family, and the object storage endpoint may answer on IPv6.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress-https
spec:
  # app-postgres-restore: the side-by-side restore cluster (runbook, Chapter 12) needs the same
  # paths as the cluster it restores - or its recovery job hangs on a silently dropped connection.
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: In
        values: [app-postgres, app-postgres-restore]
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
      ports:
        - protocol: TCP
          port: 443
