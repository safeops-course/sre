apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      # CNPG 1.30.1. Backups run through the Barman Cloud plugin (plugin-barman-cloud.yaml): the
      # in-tree barmanObjectStore is deprecated and leaves in CNPG 1.31.
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 30m
  targetNamespace: cnpg-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart requests nothing: the pod is BestEffort, so any memory it uses is over its request, and
    # such pods are the first the kubelet evicts when a node runs short. The request is what it uses at
    # rest plus room (kind 2026-10-21: 50Mi); the memory limit catches a leak.
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
