---
# Creates the `sre` bucket CNPG writes to (s3://sre/cnpg-backups/<env>/...).
# Idempotent (--ignore-existing); the Flux Kustomization waits for it to complete.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: minio
  annotations:
    # Job specs are immutable; let Flux recreate it when the manifest changes.
    kustomize.toolkit.fluxcd.io/force: Enabled
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mc
          # Chainguard mc has no shell: the alias comes from MC_HOST_local and a failed attempt
          # (MinIO not up yet) is retried by the Job (restartPolicy OnFailure, backoffLimit 20).
          image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: minio-credentials, key: MINIO_ROOT_PASSWORD }
            - name: MC_HOST_local
              value: "http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio.minio.svc.cluster.local:9000"
            - name: MC_CONFIG_DIR
              value: /tmp/mc
          args: ["mb", "--ignore-existing", "local/sre"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
