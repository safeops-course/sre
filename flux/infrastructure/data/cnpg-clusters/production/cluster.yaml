apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-postgres
  namespace: production
  annotations:
    cnpg.io/validation: "disabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  bootstrap:
    initdb:
      database: app
      owner: app
      secret:
        name: app-postgres-app
  storage:
    size: 30Gi
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://${BACKUP_S3_BUCKET}/cnpg-backups/production/app-postgres
      endpointURL: ${BACKUP_S3_ENDPOINT}
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 512Mi
  # initdb sets the owner's password only once. managed.roles keeps the app role's password equal to
  # the app-postgres-app Secret on every reconcile, so rotating the Secret (SOPS or Terraform) rotates
  # the database password too - no drift between what the backend reads and what Postgres accepts.
  managed:
    roles:
      - name: app
        ensure: present
        login: true
        passwordSecret:
          name: app-postgres-app
