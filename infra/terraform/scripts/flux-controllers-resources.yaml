# The Flux controllers' resource requests - one file for every cluster module: the FluxInstance in
# kind_cluster, hcloud_cluster, gke_cluster, eks_cluster, aks_cluster, doks_cluster, sks_cluster (and every new provider) puts this block under its spec,
# and a change here re-applies it (trigger controllers_resources).
#
# Flux's own defaults request 100m CPU per controller, 560m for the six of them, and they use 1-6m at
# rest (measured on kind 2026-10-21): a request is what the scheduler sets aside, used or not, and that
# 0.5 core did not fit next to the platform on a 2 vCPU node. 20m each is the scheduling floor; the
# limits stay Flux's (1 CPU, 1 GiB), so a reconcile still bursts. Memory is set to what they use:
# kustomize-controller 116Mi and helm-controller 63Mi on kind, more with more objects - 192Mi for both.
# https://fluxcd.control-plane.io/operator/fluxinstance/#kustomize-patches
kustomize:
  patches:
    - target:
        kind: Deployment
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/resources/requests
          value:
            cpu: 20m
            memory: 64Mi
    - target:
        kind: Deployment
        name: "(kustomize-controller|helm-controller)"
      patch: |
        - op: replace
          path: /spec/template/spec/containers/0/resources/requests/memory
          value: 192Mi
